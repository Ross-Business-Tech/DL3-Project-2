<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>DL3 Investor CRM</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#ffffff;--surface:#ffffff;--card-bg:rgba(255,255,255,.62);--mark:.07;--text:#10201d;--muted:#58665f;--border:#dee1e2;--accent:#1f7a6e;--on-accent:#ffffff;--fill:#23c6b5;--on-fill:#06201c;--brand:#ffffff;--brand-text:#10201d;--brand-line:#23c6b5;--logo-teal:#2b8f83;--good:#1d6b45;--warn:#8a5a00;--bad:#9b2226;--chip:#f1f5f4;color-scheme:light}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{padding:12px 18px;border-bottom:3px solid var(--brand-line);background:var(--brand);color:var(--brand-text);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{font-size:16px;margin:0}
h2{font-size:15px;margin:14px 0 8px}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--surface)}
main{padding:14px 18px;max-width:1200px;margin:0 auto}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.metric .v{font-size:22px;font-weight:600}
.metric .l{color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.wrap{overflow-x:auto}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;background:var(--chip);font-size:12px;margin:1px 3px 1px 0}
.flag{color:var(--warn)}
.bad{color:var(--bad)}
.good{color:var(--good)}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;padding:5px 7px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);max-width:100%}
button{font:inherit;padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);cursor:pointer}
button.primary,nav button.primary{background:var(--fill);color:var(--on-fill);border-color:var(--fill);font-weight:600}
a{color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
.notice{padding:8px 10px;border-radius:6px;background:transparent;border:1px solid var(--border);border-left:3px solid var(--logo-teal);margin:0 0 12px}
header .disclaimer{color:var(--muted)}
header h1{color:var(--accent);font-size:18px}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:url("dl3-logo.png?v=2") center 55%/min(78vmin,620px) no-repeat;opacity:var(--mark)}
.disclaimer{font-size:12px;color:var(--muted)}
.gauge{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.gbar{display:inline-block;width:56px;height:7px;border-radius:4px;background:var(--chip);overflow:hidden}
.gfill{display:block;height:100%}
.gfill.hot{background:var(--good)}.gfill.warm{background:#4a8c6a}.gfill.luke{background:var(--warn)}.gfill.cold{background:var(--muted)}.gfill.none{background:var(--bad)}
.fu{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.fu:last-of-type{border-bottom:0}
.fu.late{border-left:3px solid var(--bad);padding-left:8px}
.fu-main{flex:1 1 240px;min-width:0}
.fu-side{flex:0 1 auto;text-align:right}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 12px}
.formgrid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.formgrid label.wide{grid-column:1/-1}
.formgrid input,.formgrid select{font-size:14px;color:var(--text);width:100%;box-sizing:border-box}
.pbar{height:10px;border-radius:5px;background:var(--chip);overflow:hidden;margin-top:6px}
.pbar span{display:block;height:100%;background:var(--fill)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:8px 0}
.sgrid .card{margin:0;padding:8px 10px}
.sgrid .metric .v{font-size:20px}
header input{width:170px}
.dangerbtn{background:#9b2226;color:#fff;border-color:#9b2226;font-weight:600}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px}
h3{font-size:13px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rtable{width:100%}
.linkchip.on{background:var(--fill);color:var(--on-fill);border-color:var(--fill);font-weight:600}
@media (max-width:640px){
  .rtable thead{display:none}
  .rtable,.rtable tbody{display:block}
  .rtable tr{display:block;border:1px solid var(--border);border-radius:8px;margin:8px 0;padding:8px 10px}
  .rtable td{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border:0;padding:3px 0;text-align:right}
  .rtable td::before{content:attr(data-label);color:var(--muted);font-size:12px;text-align:left;flex:0 0 auto}
  .rtable td[data-label="Investor"]{display:block;text-align:left}
  .rtable td[data-label="Investor"]::before{display:none}
}
details.card>summary{cursor:pointer}
.linkchip{font:inherit;font-size:12px;cursor:pointer;border:1px solid var(--border);color:inherit}
.linkchip:hover{border-color:var(--logo-teal)}
.flagrow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:4px 0;border-top:1px solid var(--border)}
.flagrow:first-child{border-top:0}
.fixbox{margin:4px 0 8px;padding:10px;border:1px solid var(--logo-teal);border-radius:6px;border-left-width:3px}
.btnlink{display:inline-block;padding:5px 10px;border:1px solid var(--border);border-radius:6px;color:var(--text);text-decoration:none}
@media (max-width:600px){.fu-side{text-align:left;width:100%}.fu-side .row{justify-content:flex-start!important}main{padding:12px}}
</style>
</head>
<body>
<header>
  <div>
    <h1>DL3 Investor CRM</h1>
    <div class="disclaimer">Investors come from public research. Changes are saved to the shared list.</div>
  </div>
  <div class="row">
    <label>Your name <input id="whoIn" placeholder="Shown on changes you make" maxlength="60" oninput="setWho(this.value)"></label>
    <button id="signOut" hidden onclick="signOut()">Sign out</button>
  </div>
</header>
<nav id="nav">
  <button data-tab="Prospects" onclick="S.selected=null;go('Prospects')">Investors</button>
  <button data-tab="Tracker" onclick="go('Tracker')">Outreach</button>
  <button data-tab="Import" onclick="go('Import')">Import</button>
  <button data-tab="About" onclick="go('About')">About</button>
</nav>
<main id="app"></main>
<script src="tracker.js?v=1"></script>
<script src="groups.js?v=1"></script>

<script>
/* ---------- Constants ---------- */
const AS_OF="2026-11-03", CUT="2024-11-03", INACT_DAYS=30, DEFAULT_THRESHOLD=60;
let FIT_THRESHOLD=DEFAULT_THRESHOLD; // the fit score that counts as meeting DL3's standard; the team can change it on the About page
const BASE_CRIT=[
  {k:"chicago",label:"Chicago interest"},
  {k:"mf",label:"Mixed-income / multifamily experience"},
  {k:"check",label:"Equity check size"},
  {k:"strategy",label:"Strategy fit"},
  {k:"evidence",label:"Evidence of relevant deals"},
  {k:"capital",label:"Capital capacity and investor type"}
];
const DEFAULT_WEIGHTS={chicago:20,mf:20,check:20,strategy:15,evidence:15,capital:10};
let CRIT=BASE_CRIT.slice(); // the six built-in criteria plus any the team added
const TYPES=["Family office","Institutional","Qualified purchaser","Unclassified"];
const STAGES=["identified","researched","scored","reviewed","approved for outreach","contacted","meeting scheduled","in diligence","committed","passed","archived"];
const PRE_APPROVAL=["identified","researched","scored","reviewed"];
const CLOSED=["committed","passed","archived"];
/* ---------- State ---------- */
const S={
  tab:"Prospects", selected:null, msg:"", who:"", view:"all", q:"", showAdd:false, open:{},
  weights:Object.assign({},DEFAULT_WEIGHTS),
  filters:{minFit:0,conf:"",type:"",stage:""}
};
/* The person using the page types their name once; it is kept in this browser and shown on what they change. */
try { S.who = localStorage.getItem("dl3_who") || ""; } catch (e) { S.who = ""; }
document.getElementById("whoIn").value = S.who;
function setWho(v) { S.who = v.trim().slice(0, 60); try { localStorage.setItem("dl3_who", S.who); } catch (e) { /* no storage: fine */ } }
const who = () => S.who || "Team member";

let INV=[];
/* Official websites for some of the 25 research firms, found by web search (checked against the firm's own pages or press releases). Please verify. */
const KNOWN_SITES = {
  "Waterton": "https://waterton.com/",
  "RPM Living": "https://rpmliving.com/",
  "LaTerra Capital Management and Respark Residential": "https://laterradev.com/",
  "Cedar Street": "https://www.cedarst.com/",
  "Eastham Capital (with Bender Cos.)": "https://www.easthamcapital.com/",
  "Equus Capital Partners": "https://www.equuspartners.com/",
  "Intercontinental Real Estate with Magellan Development Group": "https://www.intercontinental.net/",
  "Pontegadea Inversiones (Amancio Ortega family office)": "https://www.pontegadea.com/",
  "Randolph Street Realty Capital": "https://www.rstrealty.com/",
  "FPA Multifamily": "https://www.fpamf.com/"
};
const fillableSites = () => INV.filter(i => !i.website && !i.noWebsite && KNOWN_SITES[i.name]);
async function fillKnownSites() {
  let n = 0, failed = 0;
  for (const i of fillableSites()) { i.website = KNOWN_SITES[i.name]; try { await persist(i); n++; } catch (e) { i.website = ""; failed++; } }
  S.msg = "Filled in " + n + " website" + (n === 1 ? "" : "s") + " from the research list" + (failed ? " (" + failed + " could not be saved)" : "") + ". They were found by web search, so please check them.";
  render();
}

/* ---------- Core logic ---------- */
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function val(id){return document.getElementById(id).value}
function days(a,b){return (Date.parse(a+"T00:00:00Z")-Date.parse(b+"T00:00:00Z"))/864e5}
function norm(s){return String(s).toLowerCase().replace(/[^a-z0-9]/g,"")}
function findDup(name){return INV.find(x=>norm(x.name)===norm(name))}
const rankVal=i=>{const f=fit(i);return f.unscored?-1:f.t}; // investors nobody has scored sort last
const fitLabel=i=>{const f=fit(i);return f.unscored?"Not scored":"Fit "+f.t};
function wsum(){return CRIT.reduce((a,c)=>a+S.weights[c.k],0)}
function share(k){const W=wsum();return W>0?Math.round(S.weights[k]*100/W):0}
function fit(i){
  let raw=0;
  CRIT.forEach(c=>raw+=(i.scores[c.k]|0)*S.weights[c.k]/5);
  const W=wsum();
  if(!CRIT.some(c=>(i.scores[c.k]|0)>0)) return {t:0,capped:false,unscored:true};
  let t=W>0?Math.round(raw*100/W):0, capped=false;
  if(i.scores.evidence===0&&t>60){t=60;capped=true}
  return {t,capped};
}
function recentCount(i){return i.sources.filter(s=>s.published&&s.published>=CUT).length}
function conf(i){
  if(i.selfReported)return "Low";
  const dated=i.sources.filter(s=>s.published).length;
  if(recentCount(i)>=2)return "High";
  if(dated>=1)return "Medium";
  return "Low";
}
function overdue(i){return !!i.next&&i.next<AS_OF&&!CLOSED.includes(i.stage)}
function inactive(i){return days(AS_OF,i.last)>INACT_DAYS}
function flags(i) { return FLAG_CATALOG.filter(f => f.test(i)).map(f => f.label); }
function flagChips(i){return FLAG_CATALOG.map((f,k)=>f.test(i)?`<button type="button" class="chip flag linkchip" title="Open this group and fix the flag" onclick="event.stopPropagation();openGroup('flag',${k})">${esc(f.label)}</button>`:"").join("")}
/* ---------- Permissions ---------- */
function can(){return true} // everyone on the team can edit; there is no sign-in yet
function canLogFor(){return true}
function relView(i){return{vis:i.rel,hidden:0}}

/* ---------- Actions ---------- */
function go(t){S.tab=t==="Dashboard"?"Prospects":t==="Outreach"?"Tracker":t;S.msg="";render()}
function setF(k,v){S.filters[k]=v;render()}
function selectInv(id){S.selected=id;render()}
function saveError(msg) {
  const el = document.getElementById("saveerr");
  if (el) { el.textContent = msg; el.scrollIntoView({ block: "nearest" }); } else { S.msg = msg; render(); }
}
async function saveDetail(id) {
  if (!can("edit")) return;
  const i = INV.find(x => x.id === id);
  const stage = val("d_stage");
  if (stage !== i.stage && stage === "contacted" && !i.approval) {
    S.msg = "Cannot mark " + i.name + " as contacted: no approval record. An Approver must approve outreach first."; render(); return;
  }
  const siteRaw = val("d_website").trim(), liRaw = val("d_linkedin").trim(), emRaw = val("d_email").trim();
  const site = cleanWebsite(siteRaw), li = liRaw ? cleanLinkedIn(liRaw) : "";
  if (siteRaw && !site) return saveError("The website must be a real web address, such as acme.com or https://www.acme.com.");
  if (liRaw && !li) return saveError("The firm's LinkedIn page must be a linkedin.com address.");
  if (emRaw && !validEmail(emRaw)) return saveError("That firm email address does not look right.");
  const before = JSON.stringify(toRec(i));
  const oldName = i.name;
  i.name = val("d_name").trim() || i.name;
  i.type = val("d_type"); i.hq = val("d_hq").trim(); i.check = val("d_check").trim(); i.strategy = val("d_strategy").trim();
  i.website = site; i.linkedin = li; i.contactEmail = emRaw; if (site) i.noWebsite = false;
  i.sources = parseSources(val("d_sources")); i.decisionMakers = parseDM(val("d_dm")); i.deals = lines(val("d_deals"));
  i.stage = stage; i.owner = val("d_owner").trim(); i.next = val("d_next"); i.notes = val("d_notes");
  i.suppressed = document.getElementById("d_supp").checked;
  CRIT.forEach(c => i.scores[c.k] = +val("sc_" + c.k));
  if (JSON.stringify(toRec(i)) === before) { S.msg = "No changes to save."; render(); return; }
  i.history.unshift({ date: AS_OF, role: who(), field: "record", from: oldName, to: i.name });
  S.msg = await saveRemote(i, "Saved changes to " + i.name + ".");
  render();
}

async function approve(id) {
  const i = INV.find(x => x.id === id);
  if (!S.who) { S.msg = "Type your name at the top of the page first, so the approval shows who gave it."; render(); const w = document.getElementById("whoIn"); if (w) w.focus(); return; }
  i.approval = { by: S.who, date: todayStr() };
  if (PRE_APPROVAL.includes(i.stage)) {
    i.history.unshift({ date: todayStr(), role: who(), field: "stage", from: i.stage, to: "approved for outreach" });
    i.stage = "approved for outreach";
  }
  S.msg = await saveRemote(i, "Outreach approved for " + i.name + ", by " + S.who + ".");
  render();
}

function addError(msg) {
  const el = document.getElementById("adderr");
  if (el) { el.textContent = msg; el.scrollIntoView({ block: "nearest" }); } else { S.msg = msg; render(); }
}
async function addProspect(andResearch) {
  const name = val("np_name").trim(), type = val("np_type"), hq = val("np_hq").trim();
  const siteRaw = val("np_site").trim(), cname = val("np_cname").trim(), ctitle = val("np_ctitle").trim(), cemail = val("np_cemail").trim(), cliRaw = val("np_cli").trim();
  if (!name) return addError("Enter the firm's name.");
  const dup = findDup(name);
  if (dup) return addError("There is already an investor called " + dup.name + ". Not added.");
  const site = cleanWebsite(siteRaw);
  if (siteRaw && !site) return addError("The website does not look like a web address. Try something like acme.com.");
  if ((cemail || cliRaw || ctitle) && !cname) return addError("Add the contact's name too, or clear the contact fields.");
  if (cemail && !validEmail(cemail)) return addError("The contact's email address does not look right.");
  const cli = cliRaw ? cleanLinkedIn(cliRaw) : "";
  if (cliRaw && !cli) return addError("The LinkedIn link must be a linkedin.com address, such as https://www.linkedin.com/in/name.");
  const i = newInv(name, type, hq, "Manual entry");
  i.review = "pending"; i.id = "INV-" + String(INV.length + 1).padStart(3, "0");
  if (site) i.website = site;
  if (cname) i.decisionMakers = [{ name: cname.slice(0, 160), title: ctitle.slice(0, 160), email: cemail, linkedin: cli, src: "" }];
  INV.push(i);
  S.showAdd = false;
  S.msg = await saveRemote(i, "Added " + name + ". It starts as \"To confirm\": check it, then press Confirm details." + (site ? "" : " It still needs a website.") + (cname ? "" : " It still needs a contact."));
  render();
  if (andResearch === true && i.rid) { S.selected = i.id; await runResearch(i.id); }
}

function newInv(name,type,hq,origin){
  return{id:"INV-"+String(INV.length+1).padStart(3,"0"),name,type,hq,strategy:"",check:"",
    scores:{chicago:0,mf:0,check:0,strategy:0,evidence:0,capital:0},selfReported:false,
    decisionMakers:[],deals:[],sources:[],stage:"identified",owner:"Unassigned",approval:null,
    next:"",last:AS_OF,suppressed:false,rel:[],notes:"Origin: "+origin,acts:[],history:[]};
}
/* ---------- Shared list (here.now Site Data) ---------- */
const COL = window.INVESTORS_API || "./.herenow/data/investors";
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401 && window.INVESTORS_API) { location.assign("/login"); throw new Error("HTTP 401"); }
  if (!r.ok) { const err = new Error("HTTP " + r.status); err.status = r.status; try { err.detail = (await r.json()).error; } catch (e) { /* no details */ } throw err; }
  return r.status === 204 ? null : r.json();
}
function lines(text) { return String(text || "").split("\n").map(s => s.trim()).filter(Boolean); }
function parseSources(text) {
  return lines(text).map((l, k) => { const p = l.split("|").map(x => x.trim()); return { id: "S" + (k + 1), label: p[0] || "Source", url: p[1] || "", accessed: p[2] || "", published: p[3] || null }; });
}
function parseDM(text) {
  return lines(text).map(l => { const p = l.split("|").map(x => x.trim()); return { name: p[0] || "Unnamed", title: p[1] || "", email: p[2] || "", linkedin: p[3] || "", src: "" }; });
}
function sourcesText(i) { return i.sources.map(s => [s.label, s.url, s.accessed, s.published || ""].join(" | ")).join("\n"); }
function dmText(i) { return i.decisionMakers.map(d => [d.name, d.title, d.email || "", d.linkedin || ""].join(" | ")).join("\n"); }
function parseExtra(t) {
  const o = {};
  String(t || "").split(";").forEach(p => { const m = /^(x[a-z0-9]{3,10})=([0-5])$/.exec(p.trim()); if (m) o[m[1]] = +m[2]; });
  return o;
}
function toRec(i) {
  const sc = i.scores || {};
  return {
    name: i.name || "", type: i.type || "", hq: i.hq || "", strategy: i.strategy || "", check_size: i.check || "",
    s_chicago: sc.chicago | 0, s_mf: sc.mf | 0, s_check: sc.check | 0, s_strategy: sc.strategy | 0, s_evidence: sc.evidence | 0, s_capital: sc.capital | 0,
    extra_scores: Object.keys(sc).filter(k => /^x[a-z0-9]{3,10}$/.test(k)).map(k => k + "=" + Math.min(5, Math.max(0, sc[k] | 0))).join(";"),
    sources_text: sourcesText(i), decision_text: dmText(i), deals_text: (i.deals || []).join("\n"),
    stage: i.stage || "", owner: i.owner || "", approval_by: i.approval ? i.approval.by : "", approval_date: i.approval ? i.approval.date : "",
    next_date: i.next || "", last_date: i.last || "", notes: i.notes || "", suppressed: !!i.suppressed, self_reported: !!i.selfReported,
    review_status: i.review || "approved",
    website: i.website || "", linkedin: i.linkedin || "", contact_email: i.contactEmail || "", no_website: !!i.noWebsite,
    rank_feedback: i.rankFeedback || "",
    intro_text: (i.rel || []).map(r => [r.holder, r.knows, r.confirmed || ""].join(" | ")).join("\n")
  };
}
function fromRec(r, k) {
  const d = r.data || {};
  return {
    id: "INV-" + String(k + 1).padStart(3, "0"), rid: r.id, name: d.name || "", type: d.type || "Unclassified", hq: d.hq || "",
    strategy: d.strategy || "", check: d.check_size || "",
    scores: Object.assign({ chicago: d.s_chicago | 0, mf: d.s_mf | 0, check: d.s_check | 0, strategy: d.s_strategy | 0, evidence: d.s_evidence | 0, capital: d.s_capital | 0 }, parseExtra(d.extra_scores)),
    selfReported: !!d.self_reported, sources: parseSources(d.sources_text), decisionMakers: parseDM(d.decision_text), deals: lines(d.deals_text),
    stage: d.stage || "identified", owner: d.owner || "Unassigned", approval: d.approval_by ? { by: d.approval_by, date: d.approval_date } : null,
    next: d.next_date || "", last: d.last_date || AS_OF, suppressed: !!d.suppressed, rel: lines(d.intro_text).map(l => { const p = l.split("|").map(x => x.trim()); return { holder: p[0] || "", knows: p[1] || "", confirmed: p[2] || "" }; }), notes: d.notes || "", acts: [], history: [],
    review: d.review_status || "approved",
    website: d.website || "", linkedin: d.linkedin || "", contactEmail: d.contact_email || "", noWebsite: !!d.no_website,
    rankFeedback: d.rank_feedback || "",
    aiEdited: d.ai_edited || "", aiStatus: d.ai_status || "", aiSummary: d.ai_summary || "", aiMissing: d.ai_missing || "", aiUpdated: d.ai_updated || "", aiStarted: d.ai_started || ""
  };
}
async function loadInv() {
  const all = []; let cursor = "";
  do {

function parseCsvText(text, delim = ",") { // handles quotes, the separator and line breaks inside quotes, and a leading BOM
  const rows = []; let row = [], f = "", q = false;

    else if (c === '"') q = true;

    else if (c === "\n" || c === "\r") { if (c === "\r" && text[k + 1] === "\n") k++; row.push(f); rows.push(row); row = []; f = ""; }

async function zipEntries(buf) { // the files inside a .xlsx or .docx (a zip), from its table of contents

    const nameLen = dv.getUint16(p + 28, true), extra = dv.getUint16(p + 30, true), cmt = dv.getUint16(p + 32, true);
    out[new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nameLen))] = { method: dv.getUint16(p + 10, true), csize: dv.getUint32(p + 20, true), off: dv.getUint32(p + 42, true) };

}
async function zipText(buf, entries, name) {

  if (e.method !== 8) throw new Error("unsupported zip");

  const parts = []; let total = 0;
  for (;;) { const { done, value } = await reader.read(); if (done) break; total += value.length; if (total > 30e6) { reader.cancel(); throw new Error("too big"); } parts.push(value); }

const xml = t => new DOMParser().parseFromString(t, "application/xml");
async function readXlsx(buf) {
  const z = await zipEntries(buf);
  let sheetPath = "xl/worksheets/sheet1.xml";
  const wb = await zipText(buf, z, "xl/workbook.xml"), rels = await zipText(buf, z, "xl/_rels/workbook.xml.rels");
  if (wb && rels) { // the first sheet in the workbook
    const first = xml(wb).getElementsByTagName("sheet")[0], rid = first && (first.getAttribute("r:id") || first.getAttribute("id"));
    const rel = [...xml(rels).getElementsByTagName("Relationship")].find(x => x.getAttribute("Id") === rid);
    if (rel) sheetPath = ("xl/" + rel.getAttribute("Target")).replace("xl//", "").replace(/^xl\/\.\.\//, "").replace("xl/xl/", "xl/");
  }
  const sheet = await zipText(buf, z, sheetPath); if (!sheet) throw new Error("no sheet");
  const ss = await zipText(buf, z, "xl/sharedStrings.xml");
  const shared = ss ? [...xml(ss).getElementsByTagName("si")].map(si => [...si.getElementsByTagName("t")].map(t => t.textContent).join("")) : [];
  const colIndex = ref => { let n = 0; for (const ch of String(ref).replace(/[0-9]/g, "")) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
  const rows = [];
  for (const row of xml(sheet).getElementsByTagName("row")) {
    const out = []; let next = 0;
    for (const c of row.getElementsByTagName("c")) {
      const at = c.getAttribute("r") ? colIndex(c.getAttribute("r")) : next, t = c.getAttribute("t"), v = c.getElementsByTagName("v")[0];
      let val = "";
      if (t === "inlineStr") val = [...c.getElementsByTagName("t")].map(x => x.textContent).join("");
      else if (v) val = t === "s" ? (shared[+v.textContent] || "") : t === "b" ? (v.textContent === "1" ? "TRUE" : "FALSE") : v.textContent;
      while (out.length < at) out.push(""); out[at] = val; next = at + 1;

  const z = await zipEntries(buf), doc = await zipText(buf, z, "word/document.xml"); if (!doc) throw new Error("no document");

function jsonRows(text) { // a list of firms, or {investors: [...]}; sources, deals and contacts may be lists
  let data = JSON.parse(text);
  if (data && !Array.isArray(data)) data = data.investors || data.firms || data.rows;
  if (!Array.isArray(data) || !data.length) throw new Error("no list");
  const keys = [...new Set(data.flatMap(o => Object.keys(o || {})))];
  const str = (k, v) => {
    if (v == null) return "";
    if (Array.isArray(v)) return v.map(x => x && typeof x === "object" ? (k === "contacts" ? [x.name, x.title, x.email, x.linkedin] : [x.label, x.url, x.accessed, x.published]).map(y => y || "").join(" | ") : String(x)).join("\n");
    return String(v);

// Returns the rows of the first table in the file (the first row holds the column names), or throws a plain message.
async function readTable(file) {
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  if (ext === "numbers") throw new Error("Apple Numbers files cannot be read directly. In Numbers choose File, Export To, then Excel or CSV, and upload that.");
  if (ext === "xls" || ext === "doc") throw new Error("Old .xls and .doc files cannot be read. Open the file and save it as .xlsx (Excel), .docx (Word) or CSV first.");
  if (ext === "xlsx" || ext === "docx") {
    if (file.size > 5 * 1024 * 1024) throw new Error("That file is larger than 5 MB.");
    try { return ext === "xlsx" ? await readXlsx(await file.arrayBuffer()) : await readDocx(await file.arrayBuffer()); }
    catch (e) { throw new Error("That " + ext + " file could not be read" + (ext === "docx" ? " (it needs a table whose top row has the column names)" : "") + ". Save it as CSV and try again."); }
  }
  if (file.size > 2 * 1024 * 1024) throw new Error("That file is larger than 2 MB.");
  const text = await file.text();
  if (ext === "json" || /^\s*[\[{]/.test(text)) { try { return jsonRows(text); } catch (e) { throw new Error("That JSON file should be a list of firms, each with field names like name and website."); } }
  const head = text.split(/\r?\n/, 1)[0], count = ch => head.split(ch).length - 1;
  const delim = count("\t") > count(",") && count("\t") >= count(";") ? "\t" : count(";") > count(",") ? ";" : ",";
  return parseCsvText(text, delim);
}

/* ---------- Investors from a CSV (no AI): one row per firm, saved as "To confirm", never scored ---------- */
const INV_CSV_COLS = ["name", "type", "hq", "website", "linkedin", "contact_email", "strategy", "check_size", "sources_text", "deals_text", "contacts", "s_chicago", "s_mf", "s_check", "s_strategy", "s_evidence", "s_capital", "notes", "self_reported"];
async function importInvestorsCsv() {
  const file = document.getElementById("imp_invcsv").files[0];
  if (!file) { S.iimp = { msg: "Choose a file first." }; render(); return; }
  if (/\.pdf$/i.test(file.name)) { // a PDF has no real columns: the AI reads it instead (it adds firms with no scores)
    S.iimp = { msg: "A PDF has no real columns, so the AI is reading it instead. Its result appears at the top of this page, and the investors it finds are added unscored." }; 
    if (window.INVESTORS_API && S.research && S.research.enabled) { await startImportRequest(file.name, () => fetch("/api/import/file", { method: "POST", headers: { "Content-Type": "application/octet-stream", "X-Filename": encodeURIComponent(file.name) }, body: file })); return; }
    S.iimp = { msg: "A PDF has no real columns, so only the AI can read it, and the AI is not set up yet. Save the table as Excel or CSV and upload that." }; render(); return;
  }
  let rows; try { rows = await readTable(file); } catch (e) { S.iimp = { msg: e.message }; render(); return; }
  if (rows.length < 2) { S.iimp = { msg: "The file has no rows." }; render(); return; }
  if (rows.length > 301) { S.iimp = { msg: "The file has more than 300 firms. Split it and import in parts." }; render(); return; }
  const key = h => String(h).toLowerCase().replace(/[^a-z]/g, "");
  const idx = {}; INV_CSV_COLS.forEach(c => { idx[c] = rows[0].findIndex(h => key(h) === key(c)); });
  if (idx.name < 0) { S.iimp = { msg: "The file needs a column called name. Other columns: " + INV_CSV_COLS.slice(1).join(", ") + "." }; render(); return; }
  const cell = (r, c, n, multi) => { const v = idx[c] < 0 ? "" : String(r[idx[c]] || ""); return (multi ? v.replace(/\r/g, "").split("\n").map(l => l.replace(/\s+/g, " ").trim()).filter(Boolean).join("\n") : v.replace(/[\r\n]+/g, " ").replace(/\s+/g, " ").trim()).slice(0, n); };
  const seen = new Set(INV.map(i => norm(i.name))), made = [], dup = [], bad = [], updated = []; let examples = 0;
  const upd = !!(document.getElementById("imp_upd") || {}).checked;
  const SCORE_COLS = [["s_chicago", "chicago"], ["s_mf", "mf"], ["s_check", "check"], ["s_strategy", "strategy"], ["s_evidence", "evidence"], ["s_capital", "capital"]];
  const scoreOf = (r, c) => { const v = cell(r, c, 3); return /^[0-5]$/.test(v) ? +v : null; };
  let failed = 0;
  S.iimp = { busy: true, msg: "Importing " + (rows.length - 1) + " rows..." }; render();
  for (const r of rows.slice(1)) {
    const name = cell(r, "name", 160);
    if (EXAMPLE_ROW.test(name)) { examples++; continue; }
    if (!name) { bad.push("(a row with no name)"); continue; }
    if (seen.has(norm(name))) {
      const inv = INV.find(x => norm(x.name) === norm(name));
      if (upd && inv && inv.rid && inv.review === "pending") { // fill in a firm that is still "To confirm": sources, deals and scores from the file
        if (cell(r, "sources_text", 4000, true)) inv.sources = parseSources(cell(r, "sources_text", 4000, true));
        if (cell(r, "deals_text", 4000, true)) inv.deals = lines(cell(r, "deals_text", 4000, true));
        SCORE_COLS.forEach(([c, k]) => { const v = scoreOf(r, c); if (v !== null) inv.scores[k] = v; });
        const w = cleanWebsite(cell(r, "website", 300)); if (w && !inv.website) inv.website = w;
        const l = cell(r, "linkedin", 300) ? cleanLinkedIn(cell(r, "linkedin", 300)) : ""; if (l && !inv.linkedin) inv.linkedin = l;
        const e = cell(r, "contact_email", 160); if (e && validEmail(e) && !inv.contactEmail) inv.contactEmail = e;
        try { await persist(inv); updated.push(name); } catch (e2) { failed++; bad.push(name + ": " + (e2.detail || e2.message)); }
      } else dup.push(name);
      continue;
    }
    seen.add(norm(name));
    const type = cell(r, "type", 40), site = cell(r, "website", 300), li = cell(r, "linkedin", 300), em = cell(r, "contact_email", 160);
    const rec = {
      name, type: TYPES.includes(type) && type !== "Unclassified" ? type : "Unclassified", hq: cell(r, "hq", 160), strategy: cell(r, "strategy", 400), check_size: cell(r, "check_size", 120),
      sources_text: cell(r, "sources_text", 4000, true), deals_text: cell(r, "deals_text", 4000, true), notes: cell(r, "notes", 2000, true),
      review_status: "pending", stage: "identified", owner: "Unassigned", last_date: todayStr(), suppressed: false,
      self_reported: /^(yes|true|1)$/i.test(cell(r, "self_reported", 10))
    };
    SCORE_COLS.forEach(([c]) => { const v = scoreOf(r, c); if (v !== null) rec[c] = v; });
    const w = cleanWebsite(site); if (w) rec.website = w;
    const l = li ? cleanLinkedIn(li) : ""; if (l) rec.linkedin = l;
    if (em && validEmail(em)) rec.contact_email = em;
    const dm = cell(r, "contacts", 2000, true).split("\n").map(line => { // name | title | email | linkedin, kept only if valid
      const p = line.split("|").map(x => x.trim()); if (!p[0]) return "";
      return [p[0], p[1] || "", p[2] && validEmail(p[2]) ? p[2] : "", p[3] ? cleanLinkedIn(p[3]) : ""].join(" | ");
    }).filter(Boolean).join("\n");
    if (dm) rec.decision_text = dm;
    try { const res = await api("POST", COL, rec); made.push(name); } catch (e) { failed++; bad.push(name + ": " + (e.detail || e.message)); }
  }
  try { await loadInv(); } catch (e) { /* the list reloads next time */ }
  S.iimp = { made: made.length, updated: updated.length, dup, bad, failed, examples }; render();
}
function investorsResultHtml(r) {
  if (r.msg) return `<div class="notice">${esc(r.msg)}</div>`;
  if (!r.made && !r.updated && r.examples && !r.dup.length && !r.bad.length) return `<div class="notice"><strong>Nothing was added: this file only has the example row.</strong> Replace the row named "EXAMPLE - delete this row" with your own investors, then upload it again.</div>`;

const sleep = ms => new Promise(r => setTimeout(r, ms));
function importReady() { return !!(window.INVESTORS_API && S.research && S.research.enabled); }
async function pollImport(id) {
  const end = Date.now() + 6 * 60 * 1000;
  while (Date.now() < end) {
    await sleep(3000);
    let j;
    try { j = await api("GET", "/api/import/" + id); } catch (e) { continue; }
    if (j.status === "running") continue;
    if (j.status === "failed") { S.imp = { msg: (j.error || "The import failed.") + " Nothing was added." }; render(); return; }
    try { await loadInv(); } catch (e) { /* the list reloads on the next refresh */ }
    try { S.research = await api("GET", "/api/research/status"); } catch (e) { /* keep old value */ }
    S.imp = { msg: "Import finished.", result: j.result, label: j.label }; render(); return;
  }
  S.imp = { msg: "The import is taking too long. Reload the page in a few minutes to see whether it finished." }; render();
}
async function startImportRequest(label, send) {
  S.imp = { busy: true, msg: "Sending " + label + "..." }; render();

    const r = await send();
    if (r.status === 401) { location.assign("/login"); return; }

    S.imp = { busy: true, msg: "Reading " + label + ". This can take a minute or two." }; render();

async function researchBatch(rids) {
  if (S.batch && S.batch.running) return;
  S.batch = { running: true, stop: false, done: 0, failed: 0, total: rids.length, msg: "" }; render();
  for (const rid of rids) {
    if (S.batch.stop) break;
    let cur = INV.find(x => x.rid === rid); if (!cur) { S.batch.done++; continue; }
    try { await api("POST", COL + "/" + rid + "/research"); }
    catch (e) {
      if (e.message === "HTTP 429") { S.batch.msg = "Stopped: the research limit has been reached."; break; }
      S.batch.failed++; S.batch.done++; render(); continue;
    }
    cur.aiStatus = "running"; render();
    const end = Date.now() + 6 * 60 * 1000;
    while (cur.aiStatus === "running" && Date.now() < end && !S.batch.stop) {
      await sleep(4000);
      try { cur = await refreshOne(cur); } catch (e) { /* try again */ }
    }
    if (cur.aiStatus !== "done") S.batch.failed++;
    S.batch.done++; render();
  }
  const b = S.batch; b.running = false;
  S.msg = "Researched " + (b.done - b.failed) + " of " + b.total + " imported investors." + (b.failed ? " " + b.failed + " did not finish." : "") + (b.msg ? " " + b.msg : "") + " Open each one, check it, score it, and press Confirm record.";
  try { S.research = await api("GET", "/api/research/status"); } catch (e) { /* keep */ }
  render();
}

  ["meets", "Meets criteria", i => !fit(i).unscored && fit(i).t >= FIT_THRESHOLD],
  ["unscored", "Not scored yet", i => fit(i).unscored && !i.suppressed],

  return INV.filter(i => i.review !== "pending" && !i.suppressed && !fit(i).unscored).sort((a, b) => rankVal(b) - rankVal(a)).slice(0, 10);

const viewTest = k => (VIEWS.find(v => v[0] === k) || VIEWS[0])[2];

  const snap = { hq: i.hq, check: i.check, strategy: i.strategy, website: i.website, linkedin: i.linkedin, contactEmail: i.contactEmail, deals: i.deals, decisionMakers: i.decisionMakers, noWebsite: i.noWebsite };
  i.hq = now.hq; i.check = now.check; i.strategy = now.strategy; i.website = site; i.linkedin = li; i.contactEmail = emRaw; i.deals = nowDeals;
  if (site) i.noWebsite = false;
  if (cn) i.decisionMakers = realContacts(i).concat([{ name: cn, title: ct, email: ce, linkedin: cl, src: "" }]);
  const by = who() + ", " + todayStr();
  try {
    await api("PATCH", COL + "/" + i.rid, Object.assign(toRec(i), { ai_summary: sum, ai_missing: mis, ai_edited: by }));
    i.aiSummary = sum; i.aiMissing = mis; i.aiEdited = by; S.aiEdit = null;
    i.history.unshift({ date: todayStr(), role: who(), field: "research notes and profile", from: "", to: "edited" });
    S.msg = "Saved the research notes and profile for " + i.name + (filled.length ? ". Removed the 'still to check' lines you answered" : "") + ".";
  } catch (e) { Object.assign(i, snap); err("Could not save (" + e.message + "). What you typed is still here."); return; }
  render();
}
async function startSiteResearch(id) {
  const i = INV.find(x => x.id === id); if (!i) return;
  const raw = document.getElementById("rs_site").value.trim(), w = cleanWebsite(raw);
  if (!w) { document.getElementById("rs_err").textContent = raw ? "That does not look like a web address, such as acme.com." : "Enter the firm's website first."; return; }
  i.website = w; i.noWebsite = false;
  try { await persist(i); } catch (e) { document.getElementById("rs_err").textContent = "Could not save the website (" + e.message + ")."; return; }
  S.askSite = null;
  await runResearch(id, true);
}
function detail(i) {
  const f = fit(i), W = S.weights, pending = i.review === "pending";
  const scRows = CRIT.map(c => [esc(c.label), `<select id="sc_${c.k}">${[0, 1, 2, 3, 4, 5].map(n => `<option ${n === (i.scores[c.k] | 0) ? "selected" : ""}>${n}</option>`).join("")}</select>`, share(c.k) + "%", ((i.scores[c.k] | 0) * W[c.k] / 5 * 100 / Math.max(1, wsum())).toFixed(1)]);
  scRows.push(["Total", f.unscored ? "<strong>Not scored yet</strong>" : `<strong>${f.t}</strong>`, "100%", f.unscored ? "Score each criterion below. The AI does not score." : f.capped ? "held at 60 (no verified deals)" : ""]);
  const scTable = `<div class="wrap"><table><thead><tr><th>Criterion</th><th>Score (0 to 5)</th><th>Share of score</th><th>Points</th></tr></thead><tbody>${scRows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  const rel = i.rel.length ? i.rel.map(r => `${esc(r.holder)}: ${esc(r.knows)}${r.confirmed ? ", confirmed " + esc(r.confirmed) : ""}`).join("<br>") : "None recorded";
  const src = i.sources.length ? table(["Source", "Link", "Published"], i.sources.map(s => [esc(s.label), /^https:\/\//.test(s.url) ? `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">open</a>` : esc(s.url), s.published ? esc(s.published) : '<span class="flag">missing</span>'])) : '<div class="muted">No sources yet.</div>';
  const dms = realContacts(i).length ? realContacts(i).map(contactHtml).join("<br>") : '<span class="muted">No contact yet</span>';
  const links = [i.website, i.linkedin].filter(Boolean).map(linkOrText).join("<br>") + (i.contactEmail ? (i.website || i.linkedin ? "<br>" : "") + esc(i.contactEmail) : "");
  const hist = i.history.slice(0, 10).map(h => `${esc(h.date)} · ${esc(h.role)} · ${esc(h.field)}: ${esc(h.from)} to ${esc(h.to)}`).join("<br>") || "No changes yet";
  const ai = S.research || { enabled: false };
  const running = i.aiStatus === "running";
  const canResearch = !!(window.INVESTORS_API && ai.enabled && pending && i.rid);
  const aiBtn = canResearch
    ? `<button ${running ? "disabled" : ""} onclick="runResearch('${esc(i.id)}')">${running ? "Researching..." : i.aiStatus === "done" ? "Run AI research again" : "Run AI research"}</button>`
    : `<button disabled title="${window.INVESTORS_API ? "AI research is not set up yet" : "Available on the Render version"}">Run AI research</button>`;
  const aiBlock = aiBox(i);
  const next = pending ? "Check the details, score the investor and fix the flags below, then confirm the details."
    : !i.approval ? "The details are confirmed. Approve this investor for outreach when DL3 is ready to contact them."
    : "Approved by " + esc(i.approval.by) + " on " + esc(i.approval.date) + ". Log each contact on the Outreach page.";
  const actions = (pending ? `<button class="primary" onclick="confirmRecord('${esc(i.id)}')">Confirm details</button>` : "")
    + (!pending && !i.approval ? `<button class="primary" onclick="approve('${esc(i.id)}')">Approve for outreach</button>` : "")
    + (i.approval ? `<button class="primary" onclick="trackerFor('${esc(i.id)}')">Log outreach</button>` : "")
    + (pending ? aiBtn : "");
  const facts = [["Strategy", esc(i.strategy)], ["Equity check", esc(i.check)], ["Prior deals", i.deals.map(d => esc(d)).join("<br>")]].filter(x => x[1]);
  const open = k => (S.open[k] ? "open" : "") + ` ontoggle="S.open.${k}=this.open"`;
  const removal = window.INVESTORS_API && i.rid ? `<details class="card" ${open("remove")}><summary><strong>Remove from the database</strong></summary><div style="margin-top:8px"><p>This permanently deletes <strong>${esc(i.name)}</strong> and every outreach entry logged for them. It cannot be undone. Only do this if the investor has asked to be removed.</p>
       <label><input type="checkbox" id="rm_ok"> I confirm this investor has asked to be removed from the database</label>
       <div class="row" style="margin-top:8px"><button class="dangerbtn" onclick="removeInvestor('${esc(i.id)}')">Remove permanently</button></div>
       ${S.auth && !S.auth.required ? `<p class="muted" style="margin-top:8px">There is no team password, so anyone with this address could do this. Your name is recorded in the server log.</p>` : ""}</div></details>` : "";
  const edit = `
    <h3 style="margin:0 0 6px">Scores</h3>${scTable}
    <h3>Details</h3>
    <div class="row">
      <label>Name <input id="d_name" value="${esc(i.name)}"></label>
      <label>Type <select id="d_type">${TYPES.filter(x => x !== "Unclassified").map(x => `<option ${x === i.type ? "selected" : ""}>${x}</option>`).join("")}</select></label>
      <label>HQ <input id="d_hq" value="${esc(i.hq)}"></label>
      <label>Check size <input id="d_check" value="${esc(i.check)}"></label>
      <label>Website <input id="d_website" value="${esc(i.website)}"></label>
      <label>Firm LinkedIn page <input id="d_linkedin" value="${esc(i.linkedin)}"></label>
      <label>Firm contact email <input id="d_email" value="${esc(i.contactEmail)}"></label>
    </div>
    <div style="margin-top:8px"><label>Strategy<br><input id="d_strategy" value="${esc(i.strategy)}" style="width:100%"></label></div>
    <div style="margin-top:8px"><label>Sources, one per line: label | link | date accessed | date published<br><textarea id="d_sources" rows="3" style="width:100%">${esc(sourcesText(i))}</textarea></label></div>
    <div style="margin-top:8px"><label>Contacts, one per line: name | title | email | LinkedIn link<br><textarea id="d_dm" rows="2" style="width:100%">${esc(dmText(i))}</textarea></label></div>
    <div style="margin-top:8px"><label>Prior deals, one per line<br><textarea id="d_deals" rows="2" style="width:100%">${esc(i.deals.join("\n"))}</textarea></label></div>
    <div class="row" style="margin-top:8px">
      <label>Stage <select id="d_stage">${STAGES.map(s => `<option ${s === i.stage ? "selected" : ""}>${s}</option>`).join("")}</select></label>
      <label>Owner <input id="d_owner" value="${esc(i.owner)}"></label>
      <label>Next follow-up <input type="date" id="d_next" value="${esc(i.next)}"></label>
      <label><input type="checkbox" id="d_supp" ${i.suppressed ? "checked" : ""}> Asked to be removed</label>
    </div>
    <div style="margin-top:8px"><label>Notes<br><textarea id="d_notes" rows="2" style="width:100%">${esc(i.notes)}</textarea></label></div>
    <div id="saveerr" class="bad" role="alert" style="margin-top:6px"></div>
    <div class="row" style="margin-top:10px"><button class="primary" ${running ? "disabled" : ""} onclick="saveDetail('${esc(i.id)}')">Save changes</button></div>`;
  return `<div class="card">
    <h2 style="margin-top:0">${esc(i.name)}</h2>
    <div class="muted">${esc(i.type)}${i.hq ? " · " + esc(i.hq) : ""}</div>
    <div class="row" style="margin-top:8px"><span class="chip">${f.unscored ? "Not scored yet" : "Fit " + f.t}</span><span class="chip">${esc(conf(i))} confidence</span><span class="chip">${pending ? "To confirm" : "Confirmed"}</span><span class="chip">${i.approval ? "Approved by " + esc(i.approval.by) : "Not approved yet"}</span><span class="chip">${esc(i.stage)}</span></div>${feedbackHtml(i)}
    <p style="margin:10px 0 6px">${next}</p>
    <div class="row">${actions}</div>
    <h3>To fix</h3>${flagFixRows(i, -1)}
    <h3>Contact</h3><div>${dms}</div>${links ? `<div style="margin-top:4px">${links}</div>` : ""}
    ${facts.length ? `<h3>Facts</h3><div class="facts">${facts.map(([k, v]) => `<div><strong>${k}</strong><br>${v}</div>`).join("")}</div>` : ""}
    ${aiBlock}
  </div>
  <details class="card" ${open("sources")}><summary><strong>Sources</strong> <span class="muted">(${i.sources.length})</span></summary><div style="margin-top:8px">${src}</div></details>
  <details class="card" ${open("intro")}><summary><strong>Introduction paths</strong> <span class="muted">(${i.rel.length})</span></summary><div style="margin-top:8px">${rel}</div></details>
  <details class="card" ${open("edit")}><summary><strong>Edit scores and details</strong></summary><div style="margin-top:8px">${edit}</div></details>
  <details class="card" ${open("history")}><summary><strong>History</strong></summary><div style="margin-top:8px">${hist}</div></details>
  ${removal}`;
}

function scoringEditor() {
  const rows = CRIT.map(c => `<tr><td>${esc(c.label)}${c.custom ? ' <span class="muted">(added)</span>' : ""}</td>
    <td><input type="number" min="0" max="100" step="1" id="w_${c.k}" value="${S.weights[c.k]}" style="width:80px" oninput="liveShare()"></td>
    <td id="sh_${c.k}">${share(c.k)}%</td>
    <td>${c.custom ? `<button class="dangerbtn" onclick="removeCriterion('${c.k}')">Remove</button>` : ""}</td></tr>`).join("");
  const by = S.scoreBy ? `Last changed by ${esc(S.scoreBy)}${S.scoreAt ? " on " + esc(S.scoreAt) : ""}.` : "These are the original weights.";
  return `<div class="wrap"><table><thead><tr><th>Criterion</th><th>Weight</th><th>Share of score</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="row" style="margin:10px 0 4px"><label><strong>Standard for "meets criteria":</strong> a fit score of <input type="number" min="0" max="100" step="1" id="th_val" value="${FIT_THRESHOLD}" style="width:80px"> or higher</label></div>
    <div class="muted" style="margin-bottom:6px">Investors below it are still shown, marked as below the standard. Originally ${DEFAULT_THRESHOLD}.</div>
    <div class="muted" style="margin:6px 0">Weights are relative: only their proportions matter, and every investor's score is always out of 100. A weight of 0 switches a criterion off without deleting it. ${by}</div>
    <div class="row"><button class="primary" onclick="saveWeights()">Save weights</button><button onclick="resetWeights()">Back to the original six weights</button></div>
    <h3 style="margin:14px 0 6px">Add a criterion</h3>
    <div class="row"><label>Name <input id="nc_name" maxlength="60" placeholder="e.g. Existing relationship with DL3"></label>
      <label>Weight <input type="number" min="0" max="100" step="1" id="nc_w" value="10" style="width:80px"></label>
      <button onclick="addCriterion()">Add criterion</button></div>
    <div class="muted" style="margin-top:6px">A new criterion is scored 0 to 5 on each investor's page, under Edit scores and details. Until someone scores an investor on it, it counts as 0, so everyone's score may drop at first. The AI research never scores; people do all the scoring.</div>
    <div id="scerr" class="bad" role="alert" style="margin-top:6px"></div>`;
}
function liveShare() {
  let tot = 0; CRIT.forEach(c => { const v = parseFloat(val("w_" + c.k)); tot += Number.isFinite(v) && v >= 0 ? v : 0; });
  CRIT.forEach(c => { const v = parseFloat(val("w_" + c.k)); document.getElementById("sh_" + c.k).textContent = (tot > 0 && Number.isFinite(v) && v >= 0 ? Math.round(v * 100 / tot) : 0) + "%"; });
}
function readWeights() { // the numbers typed in the table, or an error
  const w = {};
  for (const c of CRIT) {
    const raw = val("w_" + c.k).trim(), v = Number(raw);
    if (raw === "" || !Number.isInteger(v) || v < 0 || v > 100) return { error: "Each weight must be a whole number from 0 to 100 (check \"" + c.label + "\")." };
    w[c.k] = v;
  }
  if (!Object.values(w).some(v => v > 0)) return { error: "At least one weight must be above 0." };
  return { w };
}
function scErr(t) { document.getElementById("scerr").textContent = t; }
async function applyEditor(extraCustom, okText) {
  const r = readWeights(); if (r.error) return scErr(r.error);
  const th = Number(val("th_val").trim());
  if (val("th_val").trim() === "" || !Number.isInteger(th) || th < 0 || th > 100) return scErr("The standard must be a whole number from 0 to 100.");
  const cfg = scoringConfig(); cfg.weights = Object.assign({}, cfg.weights, r.w); cfg.threshold = th;
  cfg.custom = cfg.custom.map(c => ({ k: c.k, label: c.label, weight: r.w[c.k] }));
  if (extraCustom) cfg.custom.push(extraCustom);
  S.msg = await saveScoring(cfg, okText); render();
}
async function saveWeights() { await applyEditor(null, "Saved. Every investor's score and the \"meets criteria\" standard now use these settings."); }
async function addCriterion() {
  const name = cleanCrit(val("nc_name")), raw = val("nc_w").trim(), w = Number(raw);
  if (!name) return scErr("Give the new criterion a name.");
  if (CRIT.some(c => c.label.toLowerCase() === name.toLowerCase())) return scErr("There is already a criterion with that name.");
  if (CRIT.filter(c => c.custom).length >= 12) return scErr("The most you can add is 12 criteria.");
  if (raw === "" || !Number.isInteger(w) || w < 0 || w > 100) return scErr("The weight must be a whole number from 0 to 100.");
  const k = "x" + Math.random().toString(36).slice(2, 8).replace(/[^a-z0-9]/g, "a").padEnd(6, "a");
  await applyEditor({ k, label: name, weight: w }, "Added \"" + name + "\". Score investors on it from their page, under Edit scores and details.");
}
async function removeCriterion(k) {
  const c = CRIT.find(x => x.k === k); if (!c) return;
  if (!confirm("Remove the criterion \"" + c.label + "\"? The scores already entered for it are kept in the database but no longer count.")) return;
  const cfg = scoringConfig(); cfg.custom = cfg.custom.filter(x => x.k !== k); delete cfg.weights[k];
  S.msg = await saveScoring(cfg, "Removed \"" + c.label + "\"."); render();
}
async function resetWeights() {
  if (!confirm("Set the six original criteria back to their starting weights (20, 20, 20, 15, 15, 10)? Added criteria keep their weights.")) return;
  const cfg = scoringConfig(); cfg.weights = Object.assign({}, cfg.weights, DEFAULT_WEIGHTS);
  S.msg = await saveScoring(cfg, "Weights set back to the original six."); render();
}
function vAbout(){
  const w=scoringEditor();
  const decided=[
    "Every investor needs a company website and a point of contact (an email or a LinkedIn link); anything missing shows as something to fix",
    "Every investor type is eligible: family offices, institutions and qualified purchasers",
    "DL3's overall equity check range is $5M to $250M; it differs by project",
    "Everyone with the team password can approve outreach; the approval records the typed name",
    "Everyone with the team password sees everything",
    "Follow-ups: Hot 2 days, Warm 5, Lukewarm 10, No reply 7, Committed 7. Inactive after 30 days. After 3 unanswered attempts, try another approach",
    "Investors below the fit standard (" + FIT_THRESHOLD + " to start; the team can change it) are still shown, marked as below the criteria",
    "The team can change each criterion's weight and add criteria; changes apply to everyone",
    "An investor can be removed permanently, after confirming they asked to be removed (this works with or without the team password)"
  ];
  return `
  <div class="card"><h2>How the tool works</h2>
    <ol><li><strong>Find:</strong> add investors by hand, or import a file or website. The AI can research each one.</li>
    <li><strong>Review:</strong> fix what is flagged, check the scores and sources, then confirm the details.</li>
    <li><strong>Reach out:</strong> approve an investor for outreach, log every email, call and meeting, and follow up on time.</li></ol></div>
  <div class="card"><h2>How the score works</h2>
    <ul>
      <li>Each criterion is scored 0 to 5. Its points are its share of the weights times the score, divided by 5, so the total is always out of 100. The team can change the weights and add criteria below.</li>
      <li>5 means strong, verified evidence. 3 means partial or indirect. 1 means weak or inferred. 0 means no evidence or conflicting evidence.</li>
      <li>Equity check fit is judged against DL3's overall range of $5M to $250M. Each project has its own target within it.</li>
      <li>If there are no verified deals, the fit score is held at 60 until a deal is added.</li>
      <li>The standard for "meets criteria" is a fit of ${FIT_THRESHOLD} or higher (the team can change it below). Investors under it are still shown, marked as below the criteria.</li>
      <li>Confidence is separate: High means two or more dated sources from the past 24 months, Medium means at least one dated source, Low means self-reported or no dated source.</li>
    </ul>
    ${w}</div>
  <details class="card"><summary><strong>Decisions already made</strong></summary><ul>${decided.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></details>
`;
}

boot();
</script>
