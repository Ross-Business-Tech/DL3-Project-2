<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>DL3 Investor CRM - Pilot Example</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#ffffff;--surface:#ffffff;--card-bg:rgba(255,255,255,.62);--mark:.07;--text:#10201d;--muted:#58665f;--border:#dee1e2;--accent:#1f7a6e;--on-accent:#ffffff;--fill:#23c6b5;--on-fill:#06201c;--brand:#ffffff;--brand-text:#10201d;--brand-line:#23c6b5;--logo-teal:#2b8f83;--good:#1d6b45;--warn:#8a5a00;--bad:#9b2226;--chip:#f1f5f4;color-scheme:light}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{padding:12px 18px;border-bottom:3px solid var(--brand-line);background:var(--brand);color:var(--brand-text);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{font-size:16px;margin:0}
h2{font-size:15px;margin:14px 0 8px}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--surface)}
main{padding:14px 18px;max-width:1200px;margin:0 auto}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.metric .v{font-size:22px;font-weight:600}
.metric .l{color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.wrap{overflow-x:auto}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;background:var(--chip);font-size:12px;margin:1px 3px 1px 0}
.flag{color:var(--warn)}
.bad{color:var(--bad)}
.good{color:var(--good)}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;padding:5px 7px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);max-width:100%}
button{font:inherit;padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);cursor:pointer}
button.primary,nav button.primary{background:var(--fill);color:var(--on-fill);border-color:var(--fill);font-weight:600}
a{color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
.notice{padding:8px 10px;border-radius:6px;background:transparent;border:1px solid var(--border);border-left:3px solid var(--logo-teal);margin:0 0 12px}
header .disclaimer{color:var(--muted)}
header h1{color:var(--accent);font-size:18px}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:url("dl3-logo.png?v=2") center 55%/min(78vmin,620px) no-repeat;opacity:var(--mark)}
.disclaimer{font-size:12px;color:var(--muted)}
.gauge{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.gbar{display:inline-block;width:56px;height:7px;border-radius:4px;background:var(--chip);overflow:hidden}
.gfill{display:block;height:100%}
.gfill.hot{background:var(--good)}.gfill.warm{background:#4a8c6a}.gfill.luke{background:var(--warn)}.gfill.cold{background:var(--muted)}.gfill.none{background:var(--bad)}
.fu{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.fu:last-of-type{border-bottom:0}
.fu.late{border-left:3px solid var(--bad);padding-left:8px}
.fu-main{flex:1 1 240px;min-width:0}
.fu-side{flex:0 1 auto;text-align:right}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 12px}
.formgrid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.formgrid label.wide{grid-column:1/-1}
.formgrid input,.formgrid select{font-size:14px;color:var(--text);width:100%;box-sizing:border-box}
.pbar{height:10px;border-radius:5px;background:var(--chip);overflow:hidden;margin-top:6px}
.pbar span{display:block;height:100%;background:var(--fill)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:8px 0}
.sgrid .card{margin:0;padding:8px 10px}
.sgrid .metric .v{font-size:20px}
header input{width:170px}
.dangerbtn{background:#9b2226;color:#fff;border-color:#9b2226;font-weight:600}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px}
h3{font-size:13px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rtable{width:100%}
.linkchip.on{background:var(--fill);color:var(--on-fill);border-color:var(--fill);font-weight:600}
@media (max-width:640px){
  .rtable thead{display:none}
  .rtable,.rtable tbody{display:block}
  .rtable tr{display:block;border:1px solid var(--border);border-radius:8px;margin:8px 0;padding:8px 10px}
  .rtable td{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border:0;padding:3px 0;text-align:right}
  .rtable td::before{content:attr(data-label);color:var(--muted);font-size:12px;text-align:left;flex:0 0 auto}
  .rtable td[data-label="Investor"]{display:block;text-align:left}
  .rtable td[data-label="Investor"]::before{display:none}
}
details.card>summary{cursor:pointer}
.linkchip{font:inherit;font-size:12px;cursor:pointer;border:1px solid var(--border);color:inherit}
.linkchip:hover{border-color:var(--logo-teal)}
.flagrow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:4px 0;border-top:1px solid var(--border)}
.flagrow:first-child{border-top:0}
.fixbox{margin:4px 0 8px;padding:10px;border:1px solid var(--logo-teal);border-radius:6px;border-left-width:3px}
.btnlink{display:inline-block;padding:5px 10px;border:1px solid var(--border);border-radius:6px;color:var(--text);text-decoration:none}
@media (max-width:600px){.fu-side{text-align:left;width:100%}.fu-side .row{justify-content:flex-start!important}main{padding:12px}}
</style>
</head>
<body>
<header>
  <div>
    <h1>DL3 Investor CRM: pilot example</h1>
    <div class="disclaimer">All investors come from public research. Individuals are not named. Changes are saved to the shared list.</div>
  </div>
  <div class="row">
    <label>Your name <input id="whoIn" placeholder="Shown on changes you make" maxlength="60" oninput="setWho(this.value)"></label>
    <button id="signOut" hidden onclick="signOut()">Sign out</button>
  </div>
</header>
<nav id="nav">
  <button data-tab="Prospects" onclick="S.selected=null;go('Prospects')">Investors</button>
  <button data-tab="Tracker" onclick="go('Tracker')">Outreach</button>
  <button data-tab="Import" onclick="go('Import')">Import</button>
  <button data-tab="About" onclick="go('About')">About</button>
</nav>
<main id="app"></main>
<script src="tracker.js?v=1"></script>
<script src="groups.js?v=1"></script>

/* ---------- Scoring settings: weights and extra criteria, shared by the whole team ---------- */
const setCol = () => COL.replace(/investors$/, "settings");
const cleanCrit = v => String(v || "").replace(/[|\r\n<>]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 60);
const goodWeight = v => Number.isInteger(v) && v >= 0 && v <= 100;
function applyScoring(cfg) { // checks what came from the database before using it
  const w = Object.assign({}, DEFAULT_WEIGHTS), extra = [];
  if (cfg && typeof cfg === "object") {
    BASE_CRIT.forEach(c => { if (cfg.weights && goodWeight(cfg.weights[c.k])) w[c.k] = cfg.weights[c.k]; });
    (Array.isArray(cfg.custom) ? cfg.custom : []).slice(0, 12).forEach(c => {
      const label = c && cleanCrit(c.label);
      if (c && /^x[a-z0-9]{3,10}$/.test(c.k) && label && goodWeight(c.weight) && !extra.some(e => e.k === c.k)) { extra.push({ k: c.k, label, custom: true }); w[c.k] = c.weight; }
    });
  }
  CRIT = BASE_CRIT.concat(extra); S.weights = w;
}
function scoringConfig() {
  return { weights: Object.assign({}, S.weights), custom: CRIT.filter(c => c.custom).map(c => ({ k: c.k, label: c.label, weight: S.weights[c.k] })) };
}

/* ---------- Contacts from a CSV: matched to investors by company name ---------- */
function parseCsvText(text) { // handles quotes, commas and line breaks inside quotes, and a leading BOM
  const rows = []; let row = [], f = "", q = false;
  text = String(text || "").replace(/^﻿/, "");
  for (let k = 0; k < text.length; k++) {
    const c = text[k];
    if (q) { if (c === '"') { if (text[k + 1] === '"') { f += '"'; k++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[k + 1] === "\n") k++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f.length || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
function importReady() { return !!(window.INVESTORS_API && S.research && S.research.enabled); }
async function pollImport(id) {
  const end = Date.now() + 6 * 60 * 1000;
  while (Date.now() < end) {
    await sleep(3000);
    let j;
    try { j = await api("GET", "/api/import/" + id); } catch (e) { continue; }
    if (j.status === "running") continue;
    if (j.status === "failed") { S.imp = { msg: (j.error || "The import failed.") + " Nothing was added." }; render(); return; }
    try { await loadInv(); } catch (e) { /* the list reloads on the next refresh */ }
    try { S.research = await api("GET", "/api/research/status"); } catch (e) { /* keep old value */ }
    S.imp = { msg: "Import finished.", result: j.result, label: j.label }; render(); return;
  }
  S.imp = { msg: "The import is taking too long. Reload the page in a few minutes to see whether it finished." }; render();
}
async function startImportRequest(label, send) {
  S.imp = { busy: true, msg: "Sending " + label + "..." }; render();
  try {
    const r = await send();
    if (r.status === 401) { location.assign("/login"); return; }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "The server returned an error (" + r.status + ").");
    S.imp = { busy: true, msg: "Reading " + label + ". This can take a minute or two." }; render();
    await pollImport(j.id);
  } catch (e) { S.imp = { msg: e.message }; render(); }
}
async function importFile() {
  const f = document.getElementById("imp_file").files[0];
  if (!f) { S.imp = { msg: "Choose a file first." }; render(); return; }
  if (f.size > 10 * 1024 * 1024) { S.imp = { msg: "That file is larger than 10 MB." }; render(); return; }
  if (/\.(xlsx?|docx?|pptx?)$/i.test(f.name)) { S.imp = { msg: "Excel and Word files cannot be read directly. In that program choose Save As, then CSV (for Excel) or PDF, and upload that." }; render(); return; }
  await startImportRequest(f.name, () => fetch("/api/import/file", { method: "POST", headers: { "Content-Type": "application/octet-stream", "X-Filename": encodeURIComponent(f.name) }, body: f }));
}
async function importSite() {

async function researchBatch(rids) {
  if (S.batch && S.batch.running) return;
  S.batch = { running: true, stop: false, done: 0, failed: 0, total: rids.length, msg: "" }; render();
  for (const rid of rids) {
    if (S.batch.stop) break;
    let cur = INV.find(x => x.rid === rid); if (!cur) { S.batch.done++; continue; }
    try { await api("POST", COL + "/" + rid + "/research"); }
    catch (e) {
      if (e.message === "HTTP 429") { S.batch.msg = "Stopped: the research limit has been reached."; break; }
      S.batch.failed++; S.batch.done++; render(); continue;
    }
    cur.aiStatus = "running"; render();
    const end = Date.now() + 6 * 60 * 1000;
    while (cur.aiStatus === "running" && Date.now() < end && !S.batch.stop) {
      await sleep(4000);
      try { cur = await refreshOne(cur); } catch (e) { /* try again */ }
    }
    if (cur.aiStatus !== "done") S.batch.failed++;
    S.batch.done++; render();
  }
  const b = S.batch; b.running = false;
  S.msg = "Researched " + (b.done - b.failed) + " of " + b.total + " imported investors." + (b.failed ? " " + b.failed + " did not finish." : "") + (b.msg ? " " + b.msg : "") + " Open each one, check it, score it, and press Confirm record.";
  try { S.research = await api("GET", "/api/research/status"); } catch (e) { /* keep */ }
  render();
}

  const rows = CRIT.map(c => `<tr><td>${esc(c.label)}${c.custom ? ' <span class="muted">(added)</span>' : ""}</td>

    <td>${c.custom ? `<button class="dangerbtn" onclick="removeCriterion('${c.k}')">Remove</button>` : ""}</td></tr>`).join("");
  const by = S.scoreBy ? `Last changed by ${esc(S.scoreBy)}${S.scoreAt ? " on " + esc(S.scoreAt) : ""}.` : "These are the original weights.";
  return `<div class="wrap"><table><thead><tr><th>Criterion</th><th>Weight</th><th>Share of score</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="muted" style="margin:6px 0">Weights are relative: only their proportions matter, and every investor's score is always out of 100. A weight of 0 switches a criterion off without deleting it. ${by}</div>
    <div class="row"><button class="primary" onclick="saveWeights()">Save weights</button><button onclick="resetWeights()">Back to the original six weights</button></div>
    <h3 style="margin:14px 0 6px">Add a criterion</h3>
    <div class="row"><label>Name <input id="nc_name" maxlength="60" placeholder="e.g. Existing relationship with DL3"></label>
      <label>Weight <input type="number" min="0" max="100" step="1" id="nc_w" value="10" style="width:80px"></label>
      <button onclick="addCriterion()">Add criterion</button></div>
    <div class="muted" style="margin-top:6px">A new criterion is scored 0 to 5 on each investor's page, under Edit scores and details. Until someone scores an investor on it, it counts as 0, so everyone's score may drop at first. The AI research never scores; people do all the scoring.</div>
    <div id="scerr" class="bad" role="alert" style="margin-top:6px"></div>`;
}
function liveShare() {
  let tot = 0; CRIT.forEach(c => { const v = parseFloat(val("w_" + c.k)); tot += Number.isFinite(v) && v >= 0 ? v : 0; });
  CRIT.forEach(c => { const v = parseFloat(val("w_" + c.k)); document.getElementById("sh_" + c.k).textContent = (tot > 0 && Number.isFinite(v) && v >= 0 ? Math.round(v * 100 / tot) : 0) + "%"; });
}
function readWeights() { // the numbers typed in the table, or an error
  const w = {};
  for (const c of CRIT) {
    const raw = val("w_" + c.k).trim(), v = Number(raw);
    if (raw === "" || !Number.isInteger(v) || v < 0 || v > 100) return { error: "Each weight must be a whole number from 0 to 100 (check \"" + c.label + "\")." };
    w[c.k] = v;
  }
  if (!Object.values(w).some(v => v > 0)) return { error: "At least one weight must be above 0." };
  return { w };
}
function scErr(t) { document.getElementById("scerr").textContent = t; }
async function applyEditor(extraCustom, okText) {
  const r = readWeights(); if (r.error) return scErr(r.error);
  const cfg = scoringConfig(); cfg.weights = Object.assign({}, cfg.weights, r.w);
  cfg.custom = cfg.custom.map(c => ({ k: c.k, label: c.label, weight: r.w[c.k] }));
  if (extraCustom) cfg.custom.push(extraCustom);
  S.msg = await saveScoring(cfg, okText); render();
}
async function saveWeights() { await applyEditor(null, "Weights saved. Every investor's score now uses them."); }
async function addCriterion() {
  const name = cleanCrit(val("nc_name")), raw = val("nc_w").trim(), w = Number(raw);
  if (!name) return scErr("Give the new criterion a name.");
  if (CRIT.some(c => c.label.toLowerCase() === name.toLowerCase())) return scErr("There is already a criterion with that name.");
  if (CRIT.filter(c => c.custom).length >= 12) return scErr("The most you can add is 12 criteria.");
  if (raw === "" || !Number.isInteger(w) || w < 0 || w > 100) return scErr("The weight must be a whole number from 0 to 100.");
  const k = "x" + Math.random().toString(36).slice(2, 8).replace(/[^a-z0-9]/g, "a").padEnd(6, "a");
  await applyEditor({ k, label: name, weight: w }, "Added \"" + name + "\". Score investors on it from their page, under Edit scores and details.");
}
async function removeCriterion(k) {
  const c = CRIT.find(x => x.k === k); if (!c) return;
  if (!confirm("Remove the criterion \"" + c.label + "\"? The scores already entered for it are kept in the database but no longer count.")) return;
  const cfg = scoringConfig(); cfg.custom = cfg.custom.filter(x => x.k !== k); delete cfg.weights[k];
  S.msg = await saveScoring(cfg, "Removed \"" + c.label + "\"."); render();
}
async function resetWeights() {
  if (!confirm("Set the six original criteria back to their starting weights (20, 20, 20, 15, 15, 10)? Added criteria keep their weights.")) return;
  const cfg = scoringConfig(); cfg.weights = Object.assign({}, cfg.weights, DEFAULT_WEIGHTS);
  S.msg = await saveScoring(cfg, "Weights set back to the original six."); render();
}

    "Investors below a fit of 70 are still shown, marked as below the criteria",
    "The team can change each criterion's weight and add criteria; changes apply to everyone",
    "An investor can be removed permanently, after confirming they asked to be removed (this works with or without the team password)"
  ];
  return `
  <div class="card"><h2>How the tool works</h2>
    <ol><li><strong>Find:</strong> add investors by hand, or import a file or website. The AI can research each one.</li>
    <li><strong>Review:</strong> fix what is flagged, check the scores and sources, then confirm the details.</li>
    <li><strong>Reach out:</strong> approve an investor for outreach, log every email, call and meeting, and follow up on time.</li></ol></div>
  <div class="card"><h2>How the score works</h2>
    <ul>
      <li>Each criterion is scored 0 to 5. Its points are its share of the weights times the score, divided by 5, so the total is always out of 100. The team can change the weights and add criteria below.</li>
      <li>5 means strong, verified evidence. 3 means partial or indirect. 1 means weak or inferred. 0 means no evidence or conflicting evidence.</li>
      <li>Equity check fit is judged against DL3's overall range of $5M to $250M. Each project has its own target within it.</li>
      <li>If there are no verified deals, the fit score is held at 60 until a deal is added.</li>
      <li>Investors below a fit of 70 are still shown, marked as below the criteria.</li>
      <li>Confidence is separate: High means two or more dated sources from the past 24 months, Medium means at least one dated source, Low means self-reported or no dated source.</li>
    </ul>
    ${w}</div>
  <details class="card"><summary><strong>Requirements check</strong> (the original pilot spec)</summary>${table(["Section","How this tool shows it","Status"],req)}</details>
  <details class="card"><summary><strong>Decisions already made</strong></summary><ul>${decided.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></details>
  <details class="card"><summary><strong>Still to confirm with DL3</strong></summary><ul>${confirm.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></details>`;
}

boot();
</script>
</body>
