<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>DL3 Investor CRM - Pilot Example</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#ffffff;--surface:#ffffff;--card-bg:rgba(255,255,255,.62);--mark:.07;--text:#10201d;--muted:#58665f;--border:#dee1e2;--accent:#1f7a6e;--on-accent:#ffffff;--fill:#23c6b5;--on-fill:#06201c;--brand:#ffffff;--brand-text:#10201d;--brand-line:#23c6b5;--logo-teal:#2b8f83;--good:#1d6b45;--warn:#8a5a00;--bad:#9b2226;--chip:#f1f5f4;color-scheme:light}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{padding:12px 18px;border-bottom:3px solid var(--brand-line);background:var(--brand);color:var(--brand-text);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{font-size:16px;margin:0}
h2{font-size:15px;margin:14px 0 8px}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--surface)}
main{padding:14px 18px;max-width:1200px;margin:0 auto}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.metric .v{font-size:22px;font-weight:600}
.metric .l{color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.wrap{overflow-x:auto}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;background:var(--chip);font-size:12px;margin:1px 3px 1px 0}
.flag{color:var(--warn)}
.bad{color:var(--bad)}
.good{color:var(--good)}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;padding:5px 7px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);max-width:100%}
button{font:inherit;padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);cursor:pointer}
button.primary,nav button.primary{background:var(--fill);color:var(--on-fill);border-color:var(--fill);font-weight:600}
a{color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
.notice{padding:8px 10px;border-radius:6px;background:transparent;border:1px solid var(--border);border-left:3px solid var(--logo-teal);margin:0 0 12px}
header .disclaimer{color:var(--muted)}
header h1{color:var(--accent);font-size:18px}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:url("dl3-logo.png?v=2") center 55%/min(78vmin,620px) no-repeat;opacity:var(--mark)}
.disclaimer{font-size:12px;color:var(--muted)}
.gauge{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.gbar{display:inline-block;width:56px;height:7px;border-radius:4px;background:var(--chip);overflow:hidden}
.gfill{display:block;height:100%}
.gfill.hot{background:var(--good)}.gfill.warm{background:#4a8c6a}.gfill.luke{background:var(--warn)}.gfill.cold{background:var(--muted)}.gfill.none{background:var(--bad)}
.fu{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.fu:last-of-type{border-bottom:0}
.fu.late{border-left:3px solid var(--bad);padding-left:8px}
.fu-main{flex:1 1 240px;min-width:0}
.fu-side{flex:0 1 auto;text-align:right}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 12px}
.formgrid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.formgrid label.wide{grid-column:1/-1}
.formgrid input,.formgrid select{font-size:14px;color:var(--text);width:100%;box-sizing:border-box}
.pbar{height:10px;border-radius:5px;background:var(--chip);overflow:hidden;margin-top:6px}
.pbar span{display:block;height:100%;background:var(--fill)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:8px 0}
.sgrid .card{margin:0;padding:8px 10px}
.sgrid .metric .v{font-size:20px}
header input{width:170px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px}
h3{font-size:13px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rtable{width:100%}
.linkchip.on{background:var(--fill);color:var(--on-fill);border-color:var(--fill);font-weight:600}
@media (max-width:640px){
  .rtable thead{display:none}
  .rtable,.rtable tbody{display:block}
  .rtable tr{display:block;border:1px solid var(--border);border-radius:8px;margin:8px 0;padding:8px 10px}
  .rtable td{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border:0;padding:3px 0;text-align:right}
  .rtable td::before{content:attr(data-label);color:var(--muted);font-size:12px;text-align:left;flex:0 0 auto}
  .rtable td[data-label="Investor"]{display:block;text-align:left}
  .rtable td[data-label="Investor"]::before{display:none}
}
details.card>summary{cursor:pointer}
.linkchip{font:inherit;font-size:12px;cursor:pointer;border:1px solid var(--border);color:inherit}
.linkchip:hover{border-color:var(--logo-teal)}
.flagrow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:4px 0;border-top:1px solid var(--border)}
.flagrow:first-child{border-top:0}
.fixbox{margin:4px 0 8px;padding:10px;border:1px solid var(--logo-teal);border-radius:6px;border-left-width:3px}
.btnlink{display:inline-block;padding:5px 10px;border:1px solid var(--border);border-radius:6px;color:var(--text);text-decoration:none}
@media (max-width:600px){.fu-side{text-align:left;width:100%}.fu-side .row{justify-content:flex-start!important}main{padding:12px}}
</style>
</head>

  <button data-tab="About" onclick="go('About')">About</button>
</nav>
<main id="app"></main>
<script src="tracker.js?v=1"></script>

/* ---------- Core logic ---------- */
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function val(id){return document.getElementById(id).value}
function days(a,b){return (Date.parse(a+"T00:00:00Z")-Date.parse(b+"T00:00:00Z"))/864e5}
function norm(s){return String(s).toLowerCase().replace(/[^a-z0-9]/g,"")}
function findDup(name){return INV.find(x=>norm(x.name)===norm(name))}
function fit(i){
  let raw=0;
  CRIT.forEach(c=>raw+=i.scores[c.k]*S.weights[c.k]/5);
  let t=Math.round(raw), capped=false;
  if(i.scores.evidence===0&&t>60){t=60;capped=true}
  return {t,capped};
}
function recentCount(i){return i.sources.filter(s=>s.published&&s.published>=CUT).length}
function conf(i){
  if(i.selfReported)return "Low";
  const dated=i.sources.filter(s=>s.published).length;
  if(recentCount(i)>=2)return "High";
  if(dated>=1)return "Medium";
  return "Low";
}
function overdue(i){return !!i.next&&i.next<AS_OF&&!CLOSED.includes(i.stage)}
function inactive(i){return days(AS_OF,i.last)>INACT_DAYS}
function flags(i) { return FLAG_CATALOG.filter(f => f.test(i)).map(f => f.label); }
function flagChips(i){return FLAG_CATALOG.map((f,k)=>f.test(i)?`<button type="button" class="chip flag linkchip" title="Open this group and fix the flag" onclick="event.stopPropagation();openGroup('flag',${k})">${esc(f.label)}</button>`:"").join("")}

async function saveDetail(id) {
  if (!can("edit")) return;
  const i = INV.find(x => x.id === id);
  const stage = val("d_stage");
  if (stage !== i.stage && stage === "contacted" && !i.approval) {
    S.msg = "Cannot mark " + i.name + " as contacted: no approval record. An Approver must approve outreach first."; render(); return;
  }
  const before = JSON.stringify(toRec(i));
  const oldName = i.name;
  i.name = val("d_name").trim() || i.name;
  i.type = val("d_type"); i.hq = val("d_hq").trim(); i.check = val("d_check").trim(); i.strategy = val("d_strategy").trim();
  i.website = val("d_website").trim(); i.linkedin = val("d_linkedin").trim(); i.contactEmail = val("d_email").trim();
  i.sources = parseSources(val("d_sources")); i.decisionMakers = parseDM(val("d_dm")); i.deals = lines(val("d_deals"));
  i.stage = stage; i.owner = val("d_owner").trim(); i.next = val("d_next"); i.notes = val("d_notes");
  i.suppressed = document.getElementById("d_supp").checked;
  CRIT.forEach(c => i.scores[c.k] = +val("sc_" + c.k));
  if (JSON.stringify(toRec(i)) === before) { S.msg = "No changes to save."; render(); return; }
  i.history.unshift({ date: AS_OF, role: who(), field: "record", from: oldName, to: i.name });
  S.msg = await saveRemote(i, "Saved changes to " + i.name + ".");
  render();
}

async function approve(id) {
  const i = INV.find(x => x.id === id);
  if (!S.who) { S.msg = "Type your name at the top of the page first, so the approval shows who gave it."; render(); const w = document.getElementById("whoIn"); if (w) w.focus(); return; }
  i.approval = { by: S.who, date: todayStr() };
  if (PRE_APPROVAL.includes(i.stage)) {
    i.history.unshift({ date: todayStr(), role: who(), field: "stage", from: i.stage, to: "approved for outreach" });
    i.stage = "approved for outreach";
  }
  S.msg = await saveRemote(i, "Outreach approved for " + i.name + ", by " + S.who + ".");
  render();
}

function newInv(name,type,hq,origin){
  return{id:"INV-"+String(INV.length+1).padStart(3,"0"),name,type,hq,strategy:"",check:"",
    scores:{chicago:0,mf:0,check:0,strategy:0,evidence:0,capital:0},selfReported:false,
    decisionMakers:[],deals:[],sources:[],stage:"identified",owner:"Unassigned",approval:null,
    next:"",last:AS_OF,suppressed:false,rel:[],notes:"Origin: "+origin,acts:[],history:[]};
}
async function addProspect(andResearch) {
  if (!can("edit")) return;
  const name = val("np_name").trim(), type = val("np_type"), hq = val("np_hq").trim();
  if (!name) { S.msg = "Name is required."; render(); return; }
  const dup = findDup(name);
  if (dup) { S.msg = "Possible duplicate of " + dup.name + ". Not added."; render(); return; }
  const i = newInv(name, type, hq, "Manual entry");
  i.review = "pending"; i.id = "INV-" + String(INV.length + 1).padStart(3, "0");
  INV.push(i);
  S.showAdd = false;
  S.msg = await saveRemote(i, "Added " + name + ". It starts as \"To confirm\": check it, then press Confirm details.");
  render();
  if (andResearch === true && i.rid) { S.selected = i.id; await runResearch(i.id); }
}

/* ---------- Shared list (here.now Site Data) ---------- */
const COL = window.INVESTORS_API || "./.herenow/data/investors";
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.status === 204 ? null : r.json();
}
function lines(text) { return String(text || "").split("\n").map(s => s.trim()).filter(Boolean); }
function parseSources(text) {
  return lines(text).map((l, k) => { const p = l.split("|").map(x => x.trim()); return { id: "S" + (k + 1), label: p[0] || "Source", url: p[1] || "", accessed: p[2] || "", published: p[3] || null }; });
}
function parseDM(text) {
  return lines(text).map(l => { const p = l.split("|").map(x => x.trim()); return { name: p[0] || "Unnamed", title: p[1] || "", email: p[2] || "", linkedin: p[3] || "", src: "" }; });
}
function sourcesText(i) { return i.sources.map(s => [s.label, s.url, s.accessed, s.published || ""].join(" | ")).join("\n"); }
function dmText(i) { return i.decisionMakers.map(d => [d.name, d.title, d.email || "", d.linkedin || ""].join(" | ")).join("\n"); }
function toRec(i) {
  const sc = i.scores || {};
  return {
    name: i.name || "", type: i.type || "", hq: i.hq || "", strategy: i.strategy || "", check_size: i.check || "",
    s_chicago: sc.chicago | 0, s_mf: sc.mf | 0, s_check: sc.check | 0, s_strategy: sc.strategy | 0, s_evidence: sc.evidence | 0, s_capital: sc.capital | 0,
    sources_text: sourcesText(i), decision_text: dmText(i), deals_text: (i.deals || []).join("\n"),
    stage: i.stage || "", owner: i.owner || "", approval_by: i.approval ? i.approval.by : "", approval_date: i.approval ? i.approval.date : "",
    next_date: i.next || "", last_date: i.last || "", notes: i.notes || "", suppressed: !!i.suppressed, self_reported: !!i.selfReported,
    review_status: i.review || "approved",
    website: i.website || "", linkedin: i.linkedin || "", contact_email: i.contactEmail || "",
    intro_text: (i.rel || []).map(r => [r.holder, r.knows, r.confirmed || ""].join(" | ")).join("\n")
  };
}
function fromRec(r, k) {
  const d = r.data || {};
  return {
    id: "INV-" + String(k + 1).padStart(3, "0"), rid: r.id, name: d.name || "", type: d.type || "Unclassified", hq: d.hq || "",
    strategy: d.strategy || "", check: d.check_size || "",
    scores: { chicago: d.s_chicago | 0, mf: d.s_mf | 0, check: d.s_check | 0, strategy: d.s_strategy | 0, evidence: d.s_evidence | 0, capital: d.s_capital | 0 },
    selfReported: !!d.self_reported, sources: parseSources(d.sources_text), decisionMakers: parseDM(d.decision_text), deals: lines(d.deals_text),
    stage: d.stage || "identified", owner: d.owner || "Unassigned", approval: d.approval_by ? { by: d.approval_by, date: d.approval_date } : null,
    next: d.next_date || "", last: d.last_date || AS_OF, suppressed: !!d.suppressed, rel: lines(d.intro_text).map(l => { const p = l.split("|").map(x => x.trim()); return { holder: p[0] || "", knows: p[1] || "", confirmed: p[2] || "" }; }), notes: d.notes || "", acts: [], history: [],
    review: d.review_status || "approved",
    website: d.website || "", linkedin: d.linkedin || "", contactEmail: d.contact_email || "",
    aiStatus: d.ai_status || "", aiSummary: d.ai_summary || "", aiMissing: d.ai_missing || "", aiUpdated: d.ai_updated || "", aiStarted: d.ai_started || ""
  };
}
async function loadInv() {
  const all = []; let cursor = "";
  do {
    const r = await api("GET", COL + "?limit=100" + (cursor ? "&cursor=" + encodeURIComponent(cursor) : ""));
    all.push(...(r.records || [])); cursor = r.nextCursor || "";
  } while (cursor);
  INV = all.map((r, k) => fromRec(r, k));
}
async function persist(i) {
  if (S.demo) return null;
  if (i.rid) return api("PATCH", COL + "/" + i.rid, toRec(i));
  const r = await api("POST", COL, toRec(i)); i.rid = r.record.id; return r;
}
async function saveRemote(i, okText) {
  try { await persist(i); return okText + (S.demo ? " (Demo mode: not saved.)" : ""); }
  catch (e) { return "Could not save to the shared list (" + e.message + "). The change is on screen only. Check that you are signed in as a workspace member, then try again."; }
}
async function seedShared() {
  if (!can("edit")) return;
  let n = 0;
  S.loading = true; render();
  try {
    for (const s of SEED) { const c = JSON.parse(JSON.stringify(s)); c.review = "approved"; await persist(c); n++; }
    S.msg = "Loaded " + n + " research investors into the shared list.";
  } catch (e) {
    S.msg = "Stopped after " + n + " of " + SEED.length + " (" + e.message + "). Ask your instructor to check the list before reloading.";
  }
  try { await loadInv(); S.loadError = ""; } catch (e) { S.loadError = "Could not reload the shared list (" + e.message + ")."; }
  S.loading = false; render();
}
async function confirmRecord(id) {
  if (!can("edit")) return;
  const i = INV.find(x => x.id === id);
  i.review = "approved";
  S.msg = await saveRemote(i, i.name + " is confirmed and now counts in the ranking.");
  render();
}
const linkOrText = u => /^https:\/\//.test(u) ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>` : esc(u);
async function refreshOne(i) {
  const r = await api("GET", COL + "/" + i.rid);
  const k = INV.indexOf(i);
  const fresh = fromRec(r.record, k);
  fresh.id = i.id; fresh.acts = i.acts; fresh.history = i.history; fresh.rel = i.rel;
  INV[k] = fresh; return fresh;
}
async function runResearch(id) {
  const i = INV.find(x => x.id === id);
  if (!i || !i.rid) { S.msg = "Save the investor first, then run research."; render(); return; }
  try { await api("POST", COL + "/" + i.rid + "/research"); }
  catch (e) {
    S.msg = e.message === "HTTP 429" ? "The research limit has been reached for now. Try again later."
      : e.message === "HTTP 409" ? "Research can only run on investors waiting for review, and not twice at once."
      : "Could not start research (" + e.message + ").";
    render(); return;
  }
  i.aiStatus = "running";
  S.msg = "Researching " + i.name + ". This can take a minute or two. You can keep working.";
  render();
  pollResearch(id, Date.now());
}
async function pollResearch(id, startedAt) {
  const i = INV.find(x => x.id === id); if (!i) return;
  try {
    const fresh = await refreshOne(i);
    if (fresh.aiStatus !== "running") {
      S.msg = fresh.aiStatus === "done"
        ? "Research finished for " + fresh.name + ". Check the scores and fill in what is missing, then press Confirm record."
        : "Research did not finish for " + fresh.name + ". See the notes on the record.";
      render(); return;
    }
  } catch (e) { /* network blip: try again */ }
  if (Date.now() - startedAt > 6 * 60 * 1000) { S.msg = "Research is taking too long. Reload the page later to see the result."; render(); return; }
  setTimeout(() => pollResearch(id, startedAt), 4000);
}
async function boot() {
  if (location.hash === "#tracker") S.tab = "Tracker";
  S.loading = true; render();
  try { await loadInv(); S.loadError = ""; }
  catch (e) {
    if (window.INVESTORS_API) S.loadError = "Could not reach the shared list. Reload the page, and if it keeps failing ask the team to check the server. (" + e.message + ")";
    else { // a here.now test link has no shared list: show made-up sample data, nothing is saved
      S.demo = true;
      INV = SEED.map(x => { const c = JSON.parse(JSON.stringify(x)); c.review = "approved"; return c; });
      [0, 6, 9, 10, 14, 18, 19].forEach(k => { if (INV[k]) { INV[k].approval = { by: "Approver", date: AS_OF }; INV[k].stage = "approved for outreach"; } });
    }
  }
  if (window.INVESTORS_API) {
    try { S.research = await api("GET", "/api/research/status"); } catch (e) { S.research = { enabled: false }; }
    INV.filter(x => x.aiStatus === "running").forEach(x => pollResearch(x.id, Date.now()));
  }
  await loadTracker();
  S.loading = false; render();
}

/* ---------- Export (database to CSV) ---------- */
function csvCell(v) {
  let s = String(v == null ? "" : v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // stops spreadsheet programs treating text as a formula
  return '"' + s.replace(/"/g, '""') + '"';
}
async function exportCsv() {
  let note = "";
  if (window.INVESTORS_API) { try { await loadInv(); } catch (e) { note = " (could not refresh from the database, so this is what was on screen)"; } }
  const head = ["record_id", "name", "type", "hq", "website", "firm_linkedin", "firm_contact_email", "strategy", "check_size",
    "score_chicago", "score_multifamily", "score_check_size", "score_strategy", "score_evidence", "score_capital", "fit", "fit_capped", "confidence",
    "review_status", "stage", "owner", "outreach_approval", "next_follow_up", "flags", "sources", "deals", "contacts", "notes",
    "ai_status", "ai_summary", "ai_missing", "suppressed"];
  const rows = INV.map(i => {
    const f = fit(i);
    return [i.rid || i.id, i.name, i.type, i.hq, i.website, i.linkedin, i.contactEmail, i.strategy, i.check,
      i.scores.chicago, i.scores.mf, i.scores.check, i.scores.strategy, i.scores.evidence, i.scores.capital, f.t, f.capped ? "yes" : "no", conf(i),
      i.review === "pending" ? "pending" : "confirmed", i.stage, i.owner, i.approval ? i.approval.by + " " + i.approval.date : "none", i.next,
      flags(i).join("; "), i.sources.map(s => `${s.label} ${s.url} (${s.published || "undated"})`).join(" ; "), i.deals.join(" ; "),
      i.decisionMakers.map(d => [d.name, d.title, d.email, d.linkedin].filter(Boolean).join(", ")).join(" ; "), i.notes,
      i.aiStatus || "", (i.aiSummary || "").replace(/\n/g, " "), (i.aiMissing || "").replace(/\n/g, " "), i.suppressed ? "yes" : "no"];
  });
  const csv = "﻿" + [head.join(","), ...rows.map(r => r.map(csvCell).join(","))].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = "dl3-investors-" + new Date().toISOString().slice(0, 10) + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  S.msg = "Downloaded " + INV.length + " investors as a CSV file" + note + ".";
  render();
}

/* ---------- Import (PDF or website) ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
function importReady() { return !!(window.INVESTORS_API && S.research && S.research.enabled); }
async function pollImport(id) {
  const end = Date.now() + 6 * 60 * 1000;
  while (Date.now() < end) {
    await sleep(3000);
    let j;
    try { j = await api("GET", "/api/import/" + id); } catch (e) { continue; }
    if (j.status === "running") continue;
    if (j.status === "failed") { S.imp = { msg: (j.error || "The import failed.") + " Nothing was added." }; render(); return; }
    try { await loadInv(); } catch (e) { /* the list reloads on the next refresh */ }
    try { S.research = await api("GET", "/api/research/status"); } catch (e) { /* keep old value */ }
    S.imp = { msg: "Import finished.", result: j.result, label: j.label }; render(); return;
  }
  S.imp = { msg: "The import is taking too long. Reload the page in a few minutes to see whether it finished." }; render();
}
async function startImportRequest(label, send) {
  S.imp = { busy: true, msg: "Sending " + label + "..." }; render();
  try {
    const r = await send();
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "The server returned an error (" + r.status + ").");
    S.imp = { busy: true, msg: "Reading " + label + ". This can take a minute or two." }; render();
    await pollImport(j.id);
  } catch (e) { S.imp = { msg: e.message }; render(); }
}
async function importPdf() {
  const f = document.getElementById("imp_pdf").files[0];
  if (!f) { S.imp = { msg: "Choose a PDF file first." }; render(); return; }
  if (f.size > 10 * 1024 * 1024) { S.imp = { msg: "That file is larger than 10 MB." }; render(); return; }
  await startImportRequest(f.name, () => fetch("/api/import/pdf", { method: "POST", headers: { "Content-Type": "application/pdf", "X-Filename": encodeURIComponent(f.name) }, body: f }));
}
async function importSite() {
  const u = document.getElementById("imp_url").value.trim();
  if (!/^https:\/\//i.test(u)) { S.imp = { msg: "Enter a full web address that starts with https://." }; render(); return; }
  await startImportRequest(u, () => fetch("/api/import/website", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url: u }) }));
}
async function researchBatch(rids) {
  if (S.batch && S.batch.running) return;
  S.batch = { running: true, stop: false, done: 0, failed: 0, total: rids.length, msg: "" }; render();
  for (const rid of rids) {
    if (S.batch.stop) break;
    let cur = INV.find(x => x.rid === rid); if (!cur) { S.batch.done++; continue; }
    try { await api("POST", COL + "/" + rid + "/research"); }
    catch (e) {
      if (e.message === "HTTP 429") { S.batch.msg = "Stopped: the research limit has been reached."; break; }
      S.batch.failed++; S.batch.done++; render(); continue;
    }
    cur.aiStatus = "running"; render();
    const end = Date.now() + 6 * 60 * 1000;
    while (cur.aiStatus === "running" && Date.now() < end && !S.batch.stop) {
      await sleep(4000);
      try { cur = await refreshOne(cur); } catch (e) { /* try again */ }
    }
    if (cur.aiStatus !== "done") S.batch.failed++;
    S.batch.done++; render();
  }
  const b = S.batch; b.running = false;
  S.msg = "Researched " + (b.done - b.failed) + " of " + b.total + " imported investors." + (b.failed ? " " + b.failed + " did not finish." : "") + (b.msg ? " " + b.msg : "") + " Open each one, check it, and press Confirm record.";
  try { S.research = await api("GET", "/api/research/status"); } catch (e) { /* keep */ }
  render();
}
function importResultHtml(r) {
  const made = r.created.map(c => INV.find(x => x.rid === c.id)).filter(Boolean);
  const rids = made.map(x => x.rid);
  const left = S.research && S.research.remainingToday;
  const b = S.batch;
  const names = made.length ? `<div style="margin:8px 0">${made.map(x => `<span class="chip">${nameLink(x)}</span>`).join(" ")}</div>` : "";
  const run = b && b.running
    ? `<div class="notice">Researching ${b.done} of ${b.total} done. This takes a minute or two per investor. <button onclick="S.batch.stop=true">Stop after this one</button></div>`
    : made.length ? `<div class="row"><button class="primary" onclick='researchBatch(${JSON.stringify(rids)})'>Research these ${made.length} now</button><span class="muted">${typeof left === "number" ? left + " research runs left today. " : ""}Each one uses the AI and costs money. You can also research them one at a time later.</span></div>` : "";
  return `<div class="card"><h2>Import result</h2>
    <p><strong>${made.length}</strong> added to the review queue as Pending, with no scores yet.
    ${r.skippedDuplicates.length ? ` ${r.skippedDuplicates.length} already in the list (skipped).` : ""}
    ${r.skippedIndividuals ? ` ${r.skippedIndividuals} individual people ignored (firms only).` : ""}
    ${r.leftOver ? ` ${r.leftOver} more firms were not imported because one import is limited to 50. Run it again for the rest.` : ""}</p>
    ${names}${run}

}

    <h2 style="margin-top:0">${esc(i.name)}</h2>
    <div class="muted">${esc(i.type)}${i.hq ? " · " + esc(i.hq) : ""}</div>
    <div class="row" style="margin-top:8px"><span class="chip">Fit ${f.t}</span><span class="chip">${esc(conf(i))} confidence</span><span class="chip">${pending ? "To confirm" : "Confirmed"}</span><span class="chip">${i.approval ? "Approved by " + esc(i.approval.by) : "Not approved yet"}</span><span class="chip">${esc(i.stage)}</span></div>
    <p style="margin:10px 0 6px">${next}</p>
    <div class="row">${actions}</div>
    <h3>To fix</h3>${flagFixRows(i, -1)}
    <h3>Contact</h3><div>${dms}</div>${links ? `<div style="margin-top:4px">${links}</div>` : ""}
    ${facts.length ? `<h3>Facts</h3><div class="facts">${facts.map(([k, v]) => `<div><strong>${k}</strong><br>${v}</div>`).join("")}</div>` : ""}
    ${aiBlock}
  </div>
  <details class="card" ${open("sources")}><summary><strong>Sources</strong> <span class="muted">(${i.sources.length})</span></summary><div style="margin-top:8px">${src}</div></details>
  <details class="card" ${open("intro")}><summary><strong>Introduction paths</strong> <span class="muted">(${i.rel.length})</span></summary><div style="margin-top:8px">${rel}</div></details>
  <details class="card" ${open("edit")}><summary><strong>Edit scores and details</strong></summary><div style="margin-top:8px">${edit}</div></details>
  <details class="card" ${open("history")}><summary><strong>History</strong></summary><div style="margin-top:8px">${hist}</div></details>`;
}

function vAbout(){
  const w=CRIT.map(c=>`<tr><td>${esc(c.label)}</td><td>${S.weights[c.k]}</td></tr>`).join("");
  const req=[
    ["1. Purpose and scope","Research investors with the full workflow: find, review, reach out","Demonstrated"],
    ["2. Users and roles","Everyone on the team can view and edit; approvals record who gave them","Partial: no sign-in yet"],
    ["3. Core data","Type, HQ, contacts, strategy, check range, deals, scores, sources, owner, approval, follow-up, notes","Demonstrated"],
    ["4. Data quality and provenance","Dated sources, confidence from source dates, flags with fixes, duplicate blocking","Demonstrated"],
    ["5. Scoring and ranking","Weighted criteria with anchors, deal cap, ranked list with filters, review step before an investor counts","Demonstrated"],
    ["6. Relationship mapping","Introduction paths recorded per investor and saved","Demonstrated"],
    ["7. Outreach workflow","Approval required before contact, outreach tracker with interest and follow-ups; the tool does not send messages","Demonstrated"],
    ["8. Activity logging","Every touch logged with date, channel, person, summary and next step","Demonstrated"],
    ["9. Follow-up and reminders","Suggested follow-up dates, overdue and due-today lists","Demonstrated; the 30-day inactivity threshold is a placeholder"],
    ["10. Import and export","PDF and website import with AI; full CSV download","Demonstrated on the Render version; import needs the AI key"],
    ["11. Privacy, security, compliance","Suppression flag; contacts only as entered; no sign-in","Partial: anyone with the address can use it"],
    ["12. Reporting and dashboard","Counts at the top of the Investors page that lead to the investors behind them, search, views, groups","Demonstrated; time saved is not measured"],
    ["13. Technical requirements","Web page and server on Render with a Postgres database; data saved and exportable","Demonstrated"],
    ["14. Items to confirm","Listed below","Open, pending DL3"]
  ];
  const confirm=[
    "Current CRM, database, and contact-record access",
    "Equity check range and eligible investor types",
    "Who can approve outreach (there is no sign-in yet)",
    "Who should see relationship data once there is a sign-in",
    "Outreach cadence and inactivity threshold (30 days is a placeholder)",
    "Meets-criteria threshold (70 is a placeholder)",
    "Data retention and removal policy",
    "Pilot acceptance targets"
  ];
  return `
  <div class="card"><h2>How the tool works</h2>
    <ol><li><strong>Find:</strong> add investors by hand, or import a PDF or website. The AI can research each one.</li>
    <li><strong>Review:</strong> fix what is flagged, check the scores and sources, then confirm the details.</li>
    <li><strong>Reach out:</strong> approve an investor for outreach, log every email, call and meeting, and follow up on time.</li></ol></div>
  <div class="card"><h2>How the score works</h2>
    <ul>
      <li>Each criterion is scored 0 to 5. Points equal score times weight, divided by 5. Points total up to 100.</li>
      <li>5 means strong, verified evidence. 3 means partial or indirect. 1 means weak or inferred. 0 means no evidence or conflicting evidence.</li>
      <li>If there are no verified deals, the fit score is held at 60 until a deal is added.</li>
      <li>Confidence is separate: High means two or more dated sources from the past 24 months, Medium means at least one dated source, Low means self-reported or no dated source.</li>
    </ul>
    <div class="wrap"><table><thead><tr><th>Criterion</th><th>Weight</th></tr></thead><tbody>${w}</tbody></table></div>
    <div class="muted" style="margin-top:6px">The weights are fixed for now.</div></div>
  <details class="card"><summary><strong>Requirements check</strong> (the original pilot spec)</summary>${table(["Section","How this tool shows it","Status"],req)}</details>
  <details class="card"><summary><strong>Still to confirm with DL3</strong></summary><ul>${confirm.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></details>`;
}

boot();
</script>
