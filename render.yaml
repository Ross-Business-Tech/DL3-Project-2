# Render Blueprint for the DL3 investor CRM: one web service (page + API) and one Postgres database.
# In Render: New > Blueprint > pick this repo. Free plans sleep when idle and the free database
# expires after a trial period; switch both to a paid plan before a presentation.
services:
  - type: web
    name: dl3-investor-crm
    runtime: node
    plan: free
    buildCommand: npm --prefix backend ci
    startCommand: node backend/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: dl3-investor-db
          property: connectionString
      # Automatic research. Add the key in Render's Environment tab (never in the code).
      # The U-M GPT Toolkit key (OpenAI-compatible). If this is set it is used; ANTHROPIC_API_KEY is the alternative.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: "https://api.toolkit.umgpt.umich.edu/v1"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_DAILY_LIMIT # most research runs allowed in 24 hours (each one costs money)
        value: "40"
      - key: AI_CHECK_RANGE # DL3's overall equity check range; each project has its own target inside it
        value: "$5M to $250M"
      # The team password. Everyone signs in with it. Without it the tool is open to anyone with the address,
      # and the page warns about it. Set it in Render's Environment tab, never in this file.
      - key: TEAM_PASSWORD
        sync: false

databases:
  - name: dl3-investor-db
    plan: free
    databaseName: dl3_investors
    user: dl3_investors
