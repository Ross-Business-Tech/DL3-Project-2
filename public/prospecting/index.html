<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DL3 Investor Prospecting</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>DL3 Investor Prospecting</h1>
    <p class="subtitle">Pilot list: investors from public research. Individuals are not named.</p>
    <p class="label">Prototype scoring (simulated)</p>
  </header>

  <main>
    <p id="count" class="count"></p>
    <section id="list" aria-label="Ranked investors"></section>
  </main>

  <script>
    // Always load the newest copy of the page's files, never a saved old one.
    (function () {
      var t = Date.now();
      function load(src, next) {
        var s = document.createElement("script");
        s.src = src + "?t=" + t;
        s.onload = next;
        document.body.appendChild(s);
      }
      load("ai.js", function () { load("script.js"); });
    })();
  </script>
</body>
</html>
